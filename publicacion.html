    <!-- COLUMNA DERECHA: PUBLICIDAD -->

        <div class="w-full h-full bg-gray-50 dark:bg-slate-950 border border-dashed border-gray-300 dark:border-slate-800 rounded-lg flex items-center justify-center text-center text-gray-400 text-sm">

  </main>


  <script>
    const SUPABASE_URL = 'https://aiymadawznadvavzspxj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fL7vTXJ4NLhC2CJs9nPVAg_fvzWbfCY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===== BLOQUEO DE CONTENIDO POR SESIÓN (igual que el resto de la plataforma) =====
    function hideForAuth() {
      document.documentElement.classList.add('auth-pending');
    }
    function revealApp() {
      document.documentElement.classList.remove('auth-pending');
    }

    window.addEventListener('pagehide', hideForAuth);

    window.addEventListener('pageshow', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.replace('index.html');
        return;
      }
      revealApp();
    });

    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }

    let currentUser = null;
    let currentName = null;
    let postId = null;
    let displayedPost = null;

    // ---------- Utilidades ----------
    function formatCompactTime(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffInSeconds = Math.floor((now - date) / 1000);

      if (diffInSeconds < 60) return `${Math.max(1, diffInSeconds)}s`;
      const diffInMinutes = Math.floor(diffInSeconds / 60);
      if (diffInMinutes < 60) return `${diffInMinutes} min`;
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `${diffInHours}h`;

      const months = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sept.', 'oct.', 'nov.', 'dic.'];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();

      if (year === now.getFullYear()) return `${day} ${month}`;
      return `${day} ${month} ${year}`;
    }

    // El texto se escapa primero (para que nadie pueda meter HTML) y luego se convierten los enlaces
    function linkifyContent(text) {
      if (!text) return '';
      const safe = connEscape(text);
      return safe.replace(/(https?:\/\/[^\s]+)/g, (url) => {
        let domain;
        try { domain = new URL(url).hostname.replace('www.', ''); } catch (e) { domain = url; }
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-green-600 dark:text-green-400 font-semibold hover:underline align-middle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 inline-block"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>${domain}</a>`;
      });
    }

    // "Volver": regresa a donde estaba el usuario (con su posición en el muro); si entró directo, va al inicio
    function goBack(e) {
      let sameSite = false;
      try { sameSite = document.referrer && new URL(document.referrer).origin === window.location.origin; } catch (err) { /* nada */ }
      if (sameSite && window.history.length > 1) {
        e.preventDefault();
        window.history.back();
      }
    }

    // ---------- Inicio ----------
    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.replace('index.html');
        return;
      }
      currentUser = user;
      currentName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
      document.getElementById('myProfileLink').href = `perfil.html?user=${encodeURIComponent(currentName)}`;

      initNotifications(currentUser.email);

      const params = new URLSearchParams(window.location.search);
      postId = Number(params.get('id'));
      if (!postId) { showNotFound(); return; }

      // Mi foto (para el cuadro de comentar)
      supabaseClient.from('profiles').select('avatar_url').eq('user_email', currentUser.email).maybeSingle()
        .then(({ data }) => {
          document.getElementById('myCommentAvatar').src = (data && data.avatar_url) || connAvatarFallback(currentName);
        });

      await loadPost();
    }

    function showNotFound() {
      document.getElementById('postCard').innerHTML =
        '<p class="text-sm text-gray-500 dark:text-gray-400 text-center py-6">Esta publicación no existe o fue eliminada.</p>' +
        '<div class="text-center"><a href="dashboard.html" class="text-blue-600 dark:text-blue-400 text-sm font-semibold hover:underline">Volver al inicio</a></div>';
      document.getElementById('commentsSection').classList.add('hidden');
    }

    // ---------- Publicación ----------
    async function loadPost() {
      const { data: post, error } = await supabaseClient.from('posts').select('*').eq('id', postId).maybeSingle();
      if (error || !post) { showNotFound(); return; }

      // Si alguien abre un repost, se muestra la publicación original
      if (post.repost_of) {
        window.location.replace('publicacion.html?id=' + post.repost_of);
        return;
      }
      displayedPost = post;

      const [profRes, channelSet, commentCounts, repostCounts, myRepostRes, myLikes] = await Promise.all([
        supabaseClient.from('profiles').select('avatar_url').eq('user_email', post.user_email).maybeSingle(),
        connFetchChannelSet(),
        ccFetchCounts([post.id]),
        ccFetchRepostCounts([post.id]),
        supabaseClient.from('posts').select('id').eq('repost_of', post.id).eq('user_email', currentUser.email).is('quote_text', null).limit(1),
        ccFetchMyLikes([post.id], currentUser.email)
      ]);

      const author = post.user_name || 'Usuario';
      const avatarUrl = (profRes.data && profRes.data.avatar_url) || post.avatar_url || connAvatarFallback(author);
      const isReposted = !!(myRepostRes.data && myRepostRes.data.length);
      const isChannel = connIsChannelEmail(channelSet, post.user_email);
      const isLiked = myLikes.has(post.id);

      document.title = 'ByGether - Publicación de ' + author;
      renderPost(post, { author, avatarUrl, isReposted, isChannel, isLiked, commentCount: commentCounts[post.id] || 0, repostCount: repostCounts[post.id] || 0 });

      document.getElementById('commentsSection').classList.remove('hidden');
      await loadComments();
    }

    function renderPost(post, v) {
      const id = post.id;
      const menuBtnCls = 'w-full flex items-center gap-2 text-left px-4 py-3 hover:bg-gray-100 dark:hover:bg-slate-800 transition';
      const repostIcon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 flex-shrink-0"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>';
      const quoteIcon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 flex-shrink-0"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';

      document.getElementById('postCard').innerHTML = `
        <div class="space-y-3">

          <div class="flex items-center space-x-3">
            <a href="perfil.html?user=${encodeURIComponent(v.author)}">
              <img src="${connEscape(v.avatarUrl)}" class="w-12 h-12 rounded-full object-cover border border-gray-300 dark:border-slate-700 hover:opacity-80 transition" alt="${connEscape(v.author)}">
            </a>
            <div>
              <div class="flex items-center space-x-2">
                <a href="perfil.html?user=${encodeURIComponent(v.author)}" class="font-bold text-gray-900 dark:text-white text-sm hover:underline">${connEscape(v.author)}</a>
                ${v.isChannel ? connChannelChip(true) : ''}
              </div>
              <div class="text-xs text-gray-500 dark:text-gray-400">${formatCompactTime(post.created_at)}</div>
            </div>
          </div>

          ${post.content ? `<p class="text-gray-800 dark:text-gray-200 text-base break-words whitespace-pre-line">${linkifyContent(post.content)}</p>` : ''}

          ${post.image_url ? `<img src="${connEscape(post.image_url)}" class="w-full rounded-lg max-h-[32rem] object-cover" alt="Imagen de publicación">` : ''}

          <div class="flex items-center space-x-5 border-t border-gray-100 dark:border-slate-800 pt-2 text-sm text-gray-600 dark:text-gray-400">

            ${ccLikeButtonHtml(id, post.likes, v.isLiked, currentUser.email, currentName)}

            <button onclick="focusCommentBox()" title="Comentar" class="flex items-center gap-1.5 hover:text-blue-600 font-semibold transition">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"></path></svg>
              <span id="comments-count-${id}">${v.commentCount}</span>
            </button>

            <div class="relative">
              <button onclick="toggleRepostMenu()" data-repost-toggle title="Repostear" class="flex items-center gap-1.5 hover:text-green-600 font-semibold transition ${v.isReposted ? 'text-green-600' : ''}">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
                <span id="reposts-count-${id}">${v.repostCount}</span>
              </button>

              <div id="repost-menu" class="hidden absolute left-0 bottom-full mb-2 w-52 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl shadow-lg overflow-hidden z-40">
                ${v.isReposted ? `
                  <button onclick="undoRepost()" class="${menuBtnCls}">${repostIcon} Deshacer</button>
                  <button onclick="quotePost()" class="${menuBtnCls}">${quoteIcon} Citar</button>
                ` : `
                  <button onclick="repostPost()" class="${menuBtnCls}">${repostIcon} Repostear</button>
                  <button onclick="quotePost()" class="${menuBtnCls}">${quoteIcon} Citar</button>
                `}
              </div>
            </div>

            <button onclick="sharePost()" title="Compartir" class="hover:text-blue-600 font-semibold transition">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>

          </div>
        </div>
      `;
    }

    // ---------- Botones de la publicación (mismas funciones que el muro) ----------
    function focusCommentBox() {
      const box = document.getElementById('commentInput');
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      box.focus({ preventScroll: true });
    }

    function toggleRepostMenu() {
      document.getElementById('repost-menu').classList.toggle('hidden');
    }

    document.addEventListener('click', (e) => {
      const isToggleButton = e.target.closest('[data-repost-toggle]');
      const isInsideMenu = e.target.closest('#repost-menu');
      const menu = document.getElementById('repost-menu');
      if (menu && !isToggleButton && !isInsideMenu) menu.classList.add('hidden');
    });

    async function repostPost() {
      const { error } = await supabaseClient.from('posts').insert([{
        user_email: currentUser.email,
        user_name: currentName,
        content: null,
        image_url: null,
        likes: 0,
        repost_of: postId,
        quote_text: null
      }]);
      if (error) { console.error(error); return; }
      await loadPost();
    }

    async function undoRepost() {
      const { error } = await supabaseClient.from('posts').delete()
        .eq('repost_of', postId)
        .eq('user_email', currentUser.email)
        .is('quote_text', null);
      if (error) { console.error(error); return; }
      await loadPost();
    }

    async function quotePost() {
      const quoteText = prompt('Escribe tu cita para este repost:');
      if (quoteText === null) return;

      const { error } = await supabaseClient.from('posts').insert([{
        user_email: currentUser.email,
        user_name: currentName,
        content: null,
        image_url: null,
        likes: 0,
        repost_of: postId,
        quote_text: quoteText.trim() || null
      }]);
      if (error) { console.error(error); return; }
      await loadPost();
    }

    function sharePost() {
      const text = (displayedPost && displayedPost.content) || '';
      if (navigator.share) {
        navigator.share({ title: 'ByGether', text: text, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Enlace copiado al portapapeles.');
      }
    }

    // ---------- Comentarios ----------
    async function loadComments() {
      const list = document.getElementById('commentsList');

      const { data: comments, error } = await supabaseClient
        .from('comments')
        .select('*')
        .eq('post_id', postId)
        .order('created_at', { ascending: true });

      if (error) {
        list.innerHTML = '<p class="p-6 text-sm text-gray-400 dark:text-gray-500 text-center">No se pudieron cargar los comentarios. Intenta de nuevo.</p>';
        return;
      }

      ccSetCount(postId, (comments || []).length);

      if (!comments || !comments.length) {
        list.innerHTML = '<p class="p-6 text-sm text-gray-400 dark:text-gray-500 text-center">Aún no hay comentarios. ¡Sé el primero!</p>';
        return;
      }

      // Fotos de perfil de quienes comentaron (por su correo)
      const emails = [...new Set(comments.map(c => c.user_email).filter(Boolean))];
      const avatarByEmail = {};
      if (emails.length) {
        const { data: profs } = await supabaseClient.from('profiles').select('user_email, avatar_url').in('user_email', emails);
        (profs || []).forEach(p => { if (p.avatar_url) avatarByEmail[p.user_email] = p.avatar_url; });
      }
      const channelSet = await connFetchChannelSet();

      // Datos para los botones de cada comentario (me gusta, respuestas y reposts)
      const commentIds = comments.map(c => c.id);
      const [likeCounts, replyCounts, repostCounts, myLikes, myReposts] = await Promise.all([
        ccFetchCommentLikeCounts(commentIds),
        ccFetchCommentReplyCounts(commentIds),
        ccFetchCommentRepostCounts(commentIds),
        ccFetchMyCommentLikes(commentIds, currentUser.email),
        ccFetchMyCommentReposts(commentIds, currentUser.email)
      ]);

      // Armamos el hilo: cada comentario que responde a otro se agrupa (y se indenta) bajo su comentario raíz.
      const byId = {};
      comments.forEach(c => { byId[c.id] = c; });
      function rootOf(c) {
        let cur = c;
        while (cur.reply_to && byId[cur.reply_to]) cur = byId[cur.reply_to];
        return cur.id;
      }
      const topLevel = comments.filter(c => !c.reply_to || !byId[c.reply_to]);
      const childrenByRoot = {};
      comments.forEach(c => {
        if (c.reply_to && byId[c.reply_to]) {
          const r = rootOf(c);
          (childrenByRoot[r] = childrenByRoot[r] || []).push(c);
        }
      });

      function renderComment(c, isReply) {
        const name = c.user_name || 'Usuario';
        const avatar = avatarByEmail[c.user_email] || connAvatarFallback(name);
        const actions = ccCommentActionsHtml(c, {
          likes: likeCounts[c.id] || 0,
          replies: replyCounts[c.id] || 0,
          reposts: repostCounts[c.id] || 0,
          isLiked: myLikes.has(c.id),
          isReposted: myReposts.has(c.id),
          userEmail: currentUser.email,
          userName: currentName,
          postId: postId
        });
        return `
          <div id="comentario-${c.id}" class="p-4 flex items-start gap-3 ${isReply ? 'pl-12 bg-gray-50/60 dark:bg-slate-800/40' : ''}">
            <a href="perfil.html?user=${encodeURIComponent(name)}" class="flex-shrink-0">
              <img src="${connEscape(avatar)}" class="w-10 h-10 rounded-full object-cover border border-gray-200 dark:border-slate-700 hover:opacity-80 transition" alt="${connEscape(name)}">
            </a>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <a href="perfil.html?user=${encodeURIComponent(name)}" data-user-card="${connEscape(name)}" class="font-bold text-sm text-gray-900 dark:text-white hover:underline">${connEscape(name)}</a>
                ${connIsChannelEmail(channelSet, c.user_email) ? connChannelChip(true) : ''}
                <span class="text-gray-400 text-sm">·</span>
                <span class="text-xs text-gray-500 dark:text-gray-400">${formatCompactTime(c.created_at)}</span>
              </div>
              <p class="text-sm text-gray-800 dark:text-gray-200 break-words whitespace-pre-line mt-0.5">${linkifyContent(c.content)}</p>
              ${actions}
              <div id="reply-box-${c.id}" class="hidden mt-2 flex items-start gap-2">
                <textarea id="reply-input-${c.id}" maxlength="280" rows="1" placeholder="Escribe una respuesta..." class="flex-1 text-sm p-2 rounded-lg border border-gray-200 dark:border-slate-700 bg-transparent text-gray-900 dark:text-gray-100 resize-none focus:outline-none focus:border-blue-500"></textarea>
                <button onclick="submitReply(${c.id})" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition">Responder</button>
              </div>
            </div>
          </div>
        `;
      }

      list.innerHTML = topLevel.map(c => {
        const replies = (childrenByRoot[c.id] || []).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        return renderComment(c, false) + replies.map(r => renderComment(r, true)).join('');
      }).join('');
    }

    // Abre/cierra la cajita de responder debajo de un comentario.
    window.onReplyToComment = function (commentId) {
      const box = document.getElementById(`reply-box-${commentId}`);
      if (!box) return;
      const isHidden = box.classList.contains('hidden');
      document.querySelectorAll('[id^="reply-box-"]').forEach(b => b.classList.add('hidden'));
      if (isHidden) {
        box.classList.remove('hidden');
        document.getElementById(`reply-input-${commentId}`).focus();
      }
    };

    async function submitReply(commentId) {
      const input = document.getElementById(`reply-input-${commentId}`);
      const content = input.value.trim();
      if (!content || content.length > 280) return;

      const { error } = await supabaseClient.from('comments').insert({
        post_id: postId,
        user_email: currentUser.email,
        user_name: currentName,
        content: content,
        reply_to: commentId
      });
      if (error) { alert('Error al responder: ' + error.message); return; }

      input.value = '';
      await loadComments();
    }

    // Repostear/citar un comentario: se publica como una nueva publicación en tu perfil que cita el comentario.
    window.onRepostComment = async function (commentId, quoteText) {
      const { error } = await supabaseClient.from('posts').insert({
        user_email: currentUser.email,
        user_name: currentName,
        content: null,
        image_url: null,
        likes: 0,
        repost_of_comment_id: commentId,
        quote_text: quoteText || null
      });
      if (error) { alert('Error al repostear: ' + error.message); return; }
      await loadComments();
    };

    window.onUndoCommentRepost = async function (commentId) {
      const { error } = await supabaseClient
        .from('posts')
        .delete()
        .eq('repost_of_comment_id', commentId)
        .eq('user_email', currentUser.email)
        .is('quote_text', null);
      if (error) { alert('Error al deshacer el repost: ' + error.message); return; }
      await loadComments();
    };

    function onCommentInput() {
      const input = document.getElementById('commentInput');
      document.getElementById('commentSubmitBtn').disabled = input.value.trim().length === 0;
    }

    async function submitComment() {
      const input = document.getElementById('commentInput');
      const btn = document.getElementById('commentSubmitBtn');
      const content = input.value.trim();
      if (!content || content.length > 280 || !postId) return;

      btn.disabled = true;
      const { error } = await supabaseClient.from('comments').insert({
        post_id: postId,
        user_email: currentUser.email,
        user_name: currentName,
        content: content
      });

      if (error) {
        alert('Error al comentar: ' + error.message);
        onCommentInput();
        return;
      }

      input.value = '';
      onCommentInput();
      await loadComments();
      const last = document.getElementById('commentsList').lastElementChild;
      if (last) last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    init();
  </script>

  <script src="mobile-nav.js"></script>
</body>
