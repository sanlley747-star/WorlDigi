    <!-- COLUMNA DERECHA: LISTAS DE CONEXIONES (espacio independiente) -->
    <div>
      <div class="bg-white dark:bg-slate-900 rounded-xl shadow border border-gray-200 dark:border-slate-800">
        <div class="p-4 border-b border-gray-200 dark:border-slate-800">
          <h1 class="text-lg font-bold text-gray-900 dark:text-white">Conexiones</h1>
          <p id="connOwner" class="text-sm text-gray-500 dark:text-gray-400 mt-0.5"></p>
        </div>

        <div class="flex border-b border-gray-200 dark:border-slate-800" role="tablist">
          <button id="tabSiguiendo" role="tab" onclick="setTab('siguiendo')" class="flex-1 py-3 text-sm font-semibold text-gray-500 dark:text-gray-400 border-b-2 border-transparent transition">
            Siguiendo <span id="countSiguiendo" class="ml-1">–</span>
          </button>
          <button id="tabSeguidores" role="tab" onclick="setTab('seguidores')" class="flex-1 py-3 text-sm font-semibold text-gray-500 dark:text-gray-400 border-b-2 border-transparent transition">
            Seguidores <span id="countSeguidores" class="ml-1">–</span>
          </button>
        </div>

        <div id="connList" class="divide-y divide-gray-100 dark:divide-slate-800">
          <p class="p-6 text-sm text-gray-400 dark:text-gray-500 text-center">Cargando...</p>
        </div>
      </div>
    </div>

    <!-- COLUMNA DERECHA: PUBLICIDAD -->
    <aside class="hidden lg:block">
      <div class="sticky top-6 bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800 flex flex-col items-center justify-center" style="width: 300px; height: 600px;">
        <span class="text-xs text-gray-400 uppercase tracking-widest mb-2 text-gray-400">Publicidad</span>
        <div class="w-full h-full bg-gray-50 dark:bg-slate-950 border border-dashed border-gray-300 dark:border-slate-800 rounded-lg flex items-center justify-center text-center text-gray-400 text-sm">
          Espacio Publicitario<br>300 x 600 px
        </div>
      </div>
    </aside>

  </main>

  <script>
    const SUPABASE_URL = 'https://aiymadawznadvavzspxj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fL7vTXJ4NLhC2CJs9nPVAg_fvzWbfCY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function hideForAuth() {
      document.documentElement.classList.add('auth-pending');
    }
    function revealApp() {
      document.documentElement.classList.remove('auth-pending');
    }

    window.addEventListener('pagehide', hideForAuth);

    window.addEventListener('pageshow', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.replace('index.html');
        return;
      }
      revealApp();
    });

    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }

    let currentUser = null;
    let myName = null;
    let targetEmail = null;   // de quién estamos viendo las listas (por defecto, yo)
    let targetName = null;
    let activeTab = 'siguiendo';
    let listRequestId = 0;

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.replace('index.html');
        return;
      }
      currentUser = user;
      myName = user.user_metadata?.full_name || user.email.split('@')[0];
      document.getElementById('myProfileLink').href = connProfileUrl(myName);

      initNotifications(currentUser.email);

      const params = new URLSearchParams(window.location.search);
      targetName = params.get('user') || myName;
      activeTab = params.get('tab') === 'seguidores' ? 'seguidores' : 'siguiendo';

      targetEmail = targetName === myName ? currentUser.email : await connResolveEmail(targetName);

      const owner = document.getElementById('connOwner');
      if (!targetEmail) {
        owner.textContent = '';
        document.getElementById('connList').innerHTML =
          '<p class="p-6 text-sm text-gray-400 dark:text-gray-500 text-center">No encontramos a este usuario.</p>';
        return;
      }

      if (targetEmail === currentUser.email) {
        owner.textContent = 'Tus conexiones';
      } else {
        owner.innerHTML = 'Conexiones de <a class="font-semibold hover:underline" href="' + connProfileUrl(targetName) + '">' + connEscape(targetName) + '</a>';
      }

      // Cuenta canal ajena: solo se ve la pestaña Seguidores (lo que ella sigue es privado)
      if (targetEmail !== currentUser.email && await connIsChannel(targetEmail)) {
        document.getElementById('tabSiguiendo').style.display = 'none';
        activeTab = 'seguidores';
      }

      await refreshCounts();
      setTab(activeTab);
    }

    async function refreshCounts() {
      const counts = await connCounts(targetEmail);
      document.getElementById('countSiguiendo').textContent = counts.following;
      document.getElementById('countSeguidores').textContent = counts.followers;
    }

    function setTab(tab) {
      activeTab = tab;
      const on = ['text-blue-600', 'dark:text-blue-400', 'border-blue-600', 'dark:border-blue-400'];
      const off = ['text-gray-500', 'dark:text-gray-400', 'border-transparent'];
      [['siguiendo', 'tabSiguiendo'], ['seguidores', 'tabSeguidores']].forEach(([name, id]) => {
        const el = document.getElementById(id);
        const selected = name === tab;
        on.forEach(c => el.classList.toggle(c, selected));
        off.forEach(c => el.classList.toggle(c, !selected));
        el.setAttribute('aria-selected', selected ? 'true' : 'false');
      });

      // La URL refleja la pestaña activa (sin recargar la página)
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('tab', tab);
        if (!url.searchParams.get('user')) url.searchParams.set('user', targetName);
        window.history.replaceState(null, '', url.toString());
      } catch (e) { /* nada */ }

      loadList();
    }

    function emptyMessage(tab, isMine) {
      if (tab === 'siguiendo') {
        return isMine
          ? 'Aún no sigues a nadie. Entra al perfil de alguien que te interese y presiona Conectar.'
          : 'Este usuario aún no sigue a nadie.';
      }
      return isMine
        ? 'Aún no tienes seguidores.'
        : 'Este usuario aún no tiene seguidores.';
    }

    async function loadList() {
      const requestId = ++listRequestId;
      const list = document.getElementById('connList');
      const isMine = targetEmail === currentUser.email;
      list.innerHTML = '<p class="p-6 text-sm text-gray-400 dark:text-gray-500 text-center">Cargando...</p>';

      // Siguiendo: a quién conectó este usuario. Seguidores: quién conectó con este usuario.
      const siguiendo = activeTab === 'siguiendo';
      const ownCol = siguiendo ? 'follower_email' : 'following_email';
      const otherCol = siguiendo ? 'following_email' : 'follower_email';
      const nameCol = siguiendo ? 'following_name' : 'follower_name';

      const { data, error } = await supabaseClient
        .from('connections')
        .select(otherCol + ', ' + nameCol + ', created_at')
        .eq(ownCol, targetEmail)
        .order('created_at', { ascending: false })
        .limit(200);

      if (requestId !== listRequestId) return; // el usuario cambió de pestaña mientras cargaba

      if (error) {
        list.innerHTML = '<p class="p-6 text-sm text-gray-400 dark:text-gray-500 text-center">No se pudo cargar la lista. Intenta de nuevo.</p>';
        return;
      }
      if (!data || !data.length) {
        list.innerHTML = '<p class="p-6 text-sm text-gray-400 dark:text-gray-500 text-center">' + emptyMessage(activeTab, isMine) + '</p>';
        return;
      }

      const emails = data.map(r => r[otherCol]);
      const hints = {};
      data.forEach(r => { if (r[nameCol]) hints[r[otherCol]] = r[nameCol]; });

      const [people, states] = await Promise.all([
        connFetchPeople(emails, hints),
        connFetchStates(currentUser.email, emails)
      ]);
      if (requestId !== listRequestId) return;

      list.innerHTML = data.map(r => {
        const email = r[otherCol];
        const p = people[email];
        const avatar = p.avatar || connAvatarFallback(p.name);
        const isMe = email === currentUser.email;
        return `
          <div class="p-4 flex items-center gap-3">
            <a href="${connProfileUrl(p.name)}" class="flex items-center gap-3 flex-1 min-w-0">
              <img src="${connEscape(avatar)}" class="w-11 h-11 rounded-full object-cover flex-shrink-0 border border-gray-200 dark:border-slate-700" alt="${connEscape(p.name)}">
              <span class="font-semibold text-sm text-gray-900 dark:text-white truncate" data-user-card="${connEscape(p.name)}">${connEscape(p.name)}</span>
            </a>
            ${isMe
              ? '<span class="text-xs text-gray-400 flex-shrink-0">Tú</span>'
              : '<div class="flex-shrink-0" data-conn-slot data-email="' + connEscape(email) + '" data-name="' + connEscape(p.name) + '"></div>'}
          </div>
        `;
      }).join('');

      list.querySelectorAll('[data-conn-slot]').forEach(slot => {
        const email = slot.dataset.email;
        const st = states[email] || { iFollow: false, followsMe: false };
        slot.appendChild(connCreateButton({
          myEmail: currentUser.email,
          myName: myName,
          otherEmail: email,
          otherName: slot.dataset.name,
          iFollow: st.iFollow,
          followsMe: st.followsMe,
          compact: true,
          // Si estás viendo tus propias listas, tus contadores cambian al conectar o desconectar
          onChange: () => { if (isMine) refreshCounts(); }
        }));
      });
    }

    init();
  </script>

  <script src="mobile-nav.js"></script>
</body>
