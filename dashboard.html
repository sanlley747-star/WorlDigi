  <script>
    const SUPABASE_URL = 'https://aiymadawznadvavzspxj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fL7vTXJ4NLhC2CJs9nPVAg_fvzWbfCY'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }

    function formatCompactTime(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffInSeconds = Math.floor((now - date) / 1000);

      if (diffInSeconds < 60) return `${Math.max(1, diffInSeconds)}s`;
      const diffInMinutes = Math.floor(diffInSeconds / 60);
      if (diffInMinutes < 60) return `${diffInMinutes} min`;
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `${diffInHours}h`;

      const months = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sept.', 'oct.', 'nov.', 'dic.'];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();

      if (year === now.getFullYear()) return `${day} ${month}`;
      return `${day} ${month} ${year}`;
    }

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      document.getElementById('userStatus').textContent = user.email;
      
      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
      document.getElementById('myProfileLink').href = `perfil.html?user=${encodeURIComponent(authorName)}`;

      loadPosts();
    }
    function linkifyContent(text) { if (!text) return ''; const urlRegex = /(https?:\/\/[^\s]+)/g; return text.replace(urlRegex, (url) => { let domain; try { domain = new URL(url).hostname.replace('www.', ''); } catch (e) { domain = url; } return `<a href="${url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="inline-flex items-center gap-1 text-green-600 dark:text-green-400 font-semibold hover:underline align-middle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 inline-block"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>${domain}</a>`; }); }
   async function loadPosts() {
  const { data: posts, error } = await supabaseClient
    .from('posts')
    .select('*')
    .order('created_at', { ascending: false });
     const { data: profiles } = await supabaseClient .from('profiles') .select('user_name, avatar_url'); const avatarByUser = {}; (profiles || []).forEach(p => { avatarByUser[p.user_name] = p.avatar_url; });

  const feed = document.getElementById('feed');

  if (error || !posts || !posts.length) {
    feed.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 bg-white dark:bg-slate-900 p-6 rounded-xl shadow border border-gray-200 dark:border-slate-800">No hay publicaciones aún. ¡Sé el primero!</p>';
    return;
  }

  // Creamos un índice para encontrar rápidamente la publicación original
  const postsById = {};
  posts.forEach(post => {
    postsById[post.id] = post;
  });

  feed.innerHTML = posts.map(post => {

    const author = post.user_name || 'Usuario';
    const compactTime = formatCompactTime(post.created_at);
    const avatarUrl = post.avatar_url ||
      `https://ui-avatars.com/api/?name=${encodeURIComponent(author)}&background=random`;

    // Si es un repost, obtenemos la publicación original
    const originalPost = post.repost_of
      ? postsById[post.repost_of]
      : null;

    // Datos que se mostrarán dentro del repost
    const displayPost = originalPost || post;

    const originalAuthor = displayPost.user_name || 'Usuario';

   const originalAvatarUrl = avatarByUser[originalAuthor] || displayPost.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(originalAuthor)}&background=random`;

    return `
      <div id="post-${post.id}"
           class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800 space-y-3">

        ${post.repost_of ? `
          <div class="text-sm text-gray-500 dark:text-gray-400 font-semibold">
            🔁 ${author} repostó
          </div>
        ` : ''}

        <div class="flex items-center space-x-3">

          <a href="perfil.html?user=${encodeURIComponent(originalAuthor)}">
            <img
              src="${originalAvatarUrl}"
              class="w-10 h-10 rounded-full object-cover border border-gray-300 dark:border-slate-700 hover:opacity-80 transition cursor-pointer"
              alt="${originalAuthor}">
          </a>

          <div class="flex items-center space-x-2">

            <a
              href="perfil.html?user=${encodeURIComponent(originalAuthor)}"
              class="font-bold text-gray-900 dark:text-white text-sm hover:underline">
              ${originalAuthor}
            </a>

            <span class="text-gray-400 text-sm">·</span>

            <span class="text-sm text-gray-500 dark:text-gray-400">
              ${post.repost_of ? formatCompactTime(displayPost.created_at) : compactTime}
            </span>

          </div>
        </div>

        ${displayPost.content ? `
          <p class="text-gray-800 dark:text-gray-200 text-sm break-words cursor-pointer" onclick="openPostViewer(${displayPost.id})">
            ${linkifyContent(displayPost.content)}
          </p>
        ` : ''}

        ${displayPost.image_url ? `
          <img
            src="${displayPost.image_url}"
            class="w-full rounded-lg max-h-96 object-cover cursor-pointer"
            alt="Imagen de publicación"
            onclick="openPostViewer(${displayPost.id})">
        ` : ''}

        <div class="flex items-center space-x-5 border-t border-gray-100 dark:border-slate-800 pt-2 text-sm text-gray-600 dark:text-gray-400">

          <button
            onclick="likePost(${post.id}, ${post.likes || 0})"
            class="hover:text-red-500 font-semibold transition">
            ❤️ <span id="likes-count-${post.id}">${post.likes || 0}</span>
          </button>

          <button
            onclick="commentPost(${post.id})"
            class="hover:text-blue-600 font-semibold transition">
            💬 Comentar
          </button>

          <div class="relative">

            <button
              onclick="toggleRepostMenu(${post.id})"
              class="hover:text-green-600 font-semibold transition">
              🔁 Repostear
            </button>

            <div
              id="repost-menu-${post.id}"
              class="hidden absolute left-0 bottom-full mb-2 w-52 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl shadow-lg overflow-hidden z-40">

              <button
                onclick="repostPost(${post.id})"
                class="w-full text-left px-4 py-3 hover:bg-gray-100 dark:hover:bg-slate-800 transition">
                🔁 Repostear
              </button>

              <button
                onclick="quotePost(${post.id})"
                class="w-full text-left px-4 py-3 hover:bg-gray-100 dark:hover:bg-slate-800 transition">
                ✍️ Repostear con cita
              </button>

            </div>

          </div>

          <button
            onclick="sharePost('${post.content || ''}')"
            class="hover:text-blue-600 font-semibold transition">
            🔗 Compartir
          </button>

        </div>

      </div>
    `;
  }).join('');
}

    document.getElementById('btnPublish').addEventListener('click', async () => {
      const content = document.getElementById('postContent').value.trim();
      const fileInput = document.getElementById('postImage');
      const file = fileInput.files[0];

      if (!content && !file) return alert('Escribe algo o selecciona una imagen.');

      // UI OPTIMISTA: Limpiamos campos de inmediato para dar sensación instantánea
      document.getElementById('postContent').value = '';
      fileInput.value = '';

      let imageUrl = null;
      if (file) {
        const filePath = `${Date.now()}_${file.name}`;
        const { error: uploadError } = await supabaseClient.storage
          .from('posts-images')
          .upload(filePath, file);

        if (uploadError) {
          alert('Error al subir imagen: ' + uploadError.message);
          return;
        }

        const { data: publicUrlData } = supabaseClient.storage
          .from('posts-images')
          .getPublicUrl(filePath);

        imageUrl = publicUrlData.publicUrl;
      }

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
      
      const { error } = await supabaseClient.from('posts').insert([
        { user_email: currentUser.email, user_name: authorName, content: content, image_url: imageUrl, likes: 0 }
      ]);

      if (error) alert('Error al publicar: ' + error.message);
      else {
        loadPosts(); // Refresca de fondo silenciosamente
      }
    });

    // LIKE OPTIMISTA INSTANTÁNEO (Suma el like en pantalla al instante sin esperar latencia de red)
    async function likePost(id, currentLikes) {
      const newLikes = currentLikes + 1;
      const counterElement = document.getElementById(`likes-count-${id}`);
      if (counterElement) counterElement.textContent = newLikes;

      // Actualizamos en segundo plano en Supabase
      await supabaseClient.from('posts').update({ likes: newLikes }).eq('id', id);
    }
    function toggleRepostMenu(postId) {
     const menu = document.getElementById(`repost-menu-${postId}`);

      if (!menu) return;

  menu.classList.toggle('hidden');
   }
   async function repostPost(postId) {
  alert('La función de repost se ejecutó. ID: ' + postId);

  const authorName =
    currentUser.user_metadata?.full_name ||
    currentUser.email.split('@')[0];

  const { data, error } = await supabaseClient
    .from('posts')
    .insert([
      {
        user_email: currentUser.email,
        user_name: authorName,
        content: null,
        image_url: null,
        likes: 0,
        repost_of: postId,
        quote_text: null
      }
    ])
    .select();

  if (error) {
    alert('ERROR SUPABASE: ' + error.message);
    console.error(error);
    return;
  }

  alert('REPOST GUARDADO CORRECTAMENTE');

  toggleRepostMenu(postId);
  loadPosts();
}

    function sharePost(text) {
      if (navigator.share) {
        navigator.share({ title: 'ByKonet', text: text, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Enlace copiado al portapapeles.');
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }

    // ===== VISOR DE POST + COMENTARIOS =====
    let currentViewerPostId = null;

    async function openPostViewer(postId) {
      currentViewerPostId = postId;

      const { data: post, error } = await supabaseClient
        .from('posts')
        .select('*')
        .eq('id', postId)
        .single();

      if (error || !post) return;

      const { data: profileRow } = await supabaseClient
        .from('profiles')
        .select('avatar_url')
        .eq('user_name', post.user_name)
        .maybeSingle();

      const avatarUrl = profileRow?.avatar_url || post.avatar_url ||
        `https://ui-avatars.com/api/?name=${encodeURIComponent(post.user_name || 'Usuario')}&background=random`;

      document.getElementById('postViewerAvatar').src = avatarUrl;
      document.getElementById('postViewerAuthor').textContent = post.user_name || 'Usuario';
      document.getElementById('postViewerTime').textContent = formatCompactTime(post.created_at);
      document.getElementById('postViewerContent').innerHTML = post.content ? linkifyContent(post.content) : '';

      const imageWrap = document.getElementById('postViewerImageWrap');
      if (post.image_url) {
        document.getElementById('postViewerImage').src = post.image_url;
        imageWrap.classList.remove('hidden');
      } else {
        imageWrap.classList.add('hidden');
      }

      const input = document.getElementById('postViewerCommentInput');
      input.value = '';
      updateCharCount();

      await loadComments(postId);

      const viewer = document.getElementById('postViewer');
      viewer.classList.remove('hidden');
      viewer.classList.add('flex');
    }

    function closePostViewer() {
      const viewer = document.getElementById('postViewer');
      viewer.classList.add('hidden');
      viewer.classList.remove('flex');
      currentViewerPostId = null;
    }

    function closePostViewerBackdrop(e) {
      if (e.target.id === 'postViewer') closePostViewer();
    }

    async function loadComments(postId) {
      const container = document.getElementById('postViewerComments');
      container.innerHTML = '<p class="text-sm text-gray-400 text-center">Cargando comentarios...</p>';

      const { data: comments, error } = await supabaseClient
        .from('comments')
        .select('*')
        .eq('post_id', postId)
        .order('created_at', { ascending: true });

      if (error || !comments || !comments.length) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center">Aún no hay comentarios. ¡Sé el primero!</p>';
        return;
      }

      container.innerHTML = comments.map(c => `
        <div class="flex items-start gap-2">
          <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(c.user_name)}&background=random" class="w-8 h-8 rounded-full object-cover flex-shrink-0">
          <div class="bg-gray-100 dark:bg-slate-800 rounded-xl px-3 py-2 flex-1">
            <div class="text-xs font-bold text-gray-900 dark:text-white">${c.user_name}</div>
            <div class="text-sm text-gray-700 dark:text-gray-200 break-words">${c.content}</div>
          </div>
        </div>
      `).join('');

      container.scrollTop = container.scrollHeight;
    }

    function updateCharCount() {
      const input = document.getElementById('postViewerCommentInput');
      const counter = document.getElementById('postViewerCharCount');
      const remaining = 280 - input.value.length;
      counter.textContent = remaining;
      counter.classList.toggle('text-red-500', remaining < 0);
      document.getElementById('postViewerSubmitBtn').disabled = remaining < 0 || input.value.trim().length === 0;
    }

    async function submitComment() {
      const input = document.getElementById('postViewerCommentInput');
      const content = input.value.trim();
      if (!content || content.length > 280 || !currentViewerPostId) return;

      if (!currentUser) {
        alert('Debes iniciar sesión para comentar.');
        return;
      }

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];

      const { error } = await supabaseClient.from('comments').insert({
        post_id: currentViewerPostId,
        user_email: currentUser.email,
        user_name: authorName,
        content: content
      });

      if (error) {
        alert('Error al comentar: ' + error.message);
        return;
      }

      input.value = '';
      updateCharCount();
      await loadComments(currentViewerPostId);
    }

    init();
  </script>

  <!-- Visor de post + comentarios -->
  <div id="postViewer" class="hidden fixed inset-0 bg-black/80 z-[100] items-center justify-center p-4" onclick="closePostViewerBackdrop(event)">
    <div class="bg-white dark:bg-slate-900 rounded-xl overflow-hidden max-w-4xl w-full max-h-[90vh] flex flex-col md:flex-row">

      <div id="postViewerImageWrap" class="hidden md:w-1/2 bg-black flex items-center justify-center">
        <img id="postViewerImage" src="" class="max-h-[90vh] w-full object-contain" alt="Imagen del post">
      </div>

      <div class="md:w-1/2 w-full flex flex-col max-h-[90vh]">
        <div class="p-4 border-b border-gray-200 dark:border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img id="postViewerAvatar" src="" class="w-10 h-10 rounded-full object-cover">
            <div>
              <div id="postViewerAuthor" class="font-bold text-gray-900 dark:text-white text-sm"></div>
              <div id="postViewerTime" class="text-xs text-gray-500 dark:text-gray-400"></div>
            </div>
          </div>
          <button onclick="closePostViewer()" class="text-2xl text-gray-500 hover:text-gray-800 dark:hover:text-white leading-none">&times;</button>
        </div>

        <div class="p-4 border-b border-gray-100 dark:border-slate-800">
          <p id="postViewerContent" class="text-gray-800 dark:text-gray-200 text-sm break-words"></p>
        </div>

        <div id="postViewerComments" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

        <div class="p-3 border-t border-gray-200 dark:border-slate-800">
          <textarea id="postViewerCommentInput" maxlength="280" rows="2" placeholder="Escribe un comentario..." oninput="updateCharCount()" class="w-full p-2 text-sm border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
          <div class="flex items-center justify-between mt-2">
            <span id="postViewerCharCount" class="text-xs text-gray-400">280</span>
            <button id="postViewerSubmitBtn" onclick="submitComment()" disabled class="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-bold py-1.5 px-4 rounded-full transition">Comentar</button>
          </div>
        </div>
      </div>

    </div>
  </div>
