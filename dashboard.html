<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorlDigi - Muro Principal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 dark:bg-slate-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

  <nav class="sticky top-0 z-50 bg-slate-900 text-white p-4 flex justify-between items-center shadow-md border-b border-slate-800">
    <h1 class="text-xl font-bold">WorlDigi</h1>
    <div class="flex items-center space-x-4">
      <span id="userStatus" class="text-sm text-gray-300">Cargando usuario...</span>
      <button onclick="toggleDarkMode()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg transition">🌙 / ☀️</button>
      <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-white transition">Cerrar Sesión</button>
    </div>
  </nav>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="w-full mx-auto mt-6 pl-4 pr-0 grid grid-cols-1 lg:grid-cols-[220px_1fr_300px] gap-24">

    <!-- COLUMNA IZQUIERDA: MENÚ -->
    <aside class="hidden lg:block">
      <div class="sticky top-6">
        <div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800">
          <h2 class="font-bold text-gray-800 dark:text-white mb-4">WorlDigi</h2>
          <nav class="space-y-2">
            <a href="#" class="block p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-300">🏠 Inicio</a>
            <a href="perfil.html" id="myProfileLink" class="block p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-300">👤 Mi perfil</a>
            <a href="#" class="block p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-300">🔔 Notificaciones</a>
            <a href="#" class="block p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-300">👥 Amigos</a>
          </nav>
        </div>
      </div>
    </aside>
    
    <!-- COLUMNA CENTRAL: FEED -->
    <div class="space-y-6">
      
      <!-- Formulario para publicar -->
      <div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800">
        <h2 class="text-lg font-bold mb-3 text-gray-900 dark:text-white">Crear Publicación</h2>
        <textarea id="postContent" class="w-full p-3 border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="¿Qué estás pensando?"></textarea>
        
        <div class="flex items-center justify-between mt-3">
          <input type="file" id="postImage" accept="image/*" class="text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 dark:file:bg-slate-800 file:text-blue-700 dark:file:text-blue-400 hover:file:bg-blue-100">
          <button id="btnPublish" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition">Publicar</button>
        </div>
      </div>

      <!-- Contenedor del Muro con Skeletons Iniciales (Efecto Cero Latencia Visual) -->
      <div id="feed" class="space-y-4">
        <!-- SKELETON 1 -->
        <div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800 space-y-3 animate-pulse">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gray-300 dark:bg-slate-800 rounded-full"></div>
            <div class="space-y-2">
              <div class="w-28 h-3 bg-gray-300 dark:bg-slate-800 rounded"></div>
              <div class="w-16 h-2 bg-gray-200 dark:bg-slate-800 rounded"></div>
            </div>
          </div>
          <div class="space-y-2 pt-2">
            <div class="w-full h-3 bg-gray-300 dark:bg-slate-800 rounded"></div>
            <div class="w-3/4 h-3 bg-gray-300 dark:bg-slate-800 rounded"></div>
          </div>
        </div>
        <!-- SKELETON 2 -->
        <div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800 space-y-3 animate-pulse">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gray-300 dark:bg-slate-800 rounded-full"></div>
            <div class="space-y-2">
              <div class="w-24 h-3 bg-gray-300 dark:bg-slate-800 rounded"></div>
              <div class="w-12 h-2 bg-gray-200 dark:bg-slate-800 rounded"></div>
            </div>
          </div>
          <div class="w-full h-32 bg-gray-300 dark:bg-slate-800 rounded-lg"></div>
        </div>
      </div>

    </div>

    <!-- COLUMNA DERECHA: PUBLICIDAD -->
    <aside class="hidden lg:block">
      <div class="sticky top-6 bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800 flex flex-col items-center justify-center" style="width: 300px; height: 600px;">
        <span class="text-xs text-gray-400 uppercase tracking-widest mb-2 text-gray-400">Publicidad</span>
        <div class="w-full h-full bg-gray-50 dark:bg-slate-950 border border-dashed border-gray-300 dark:border-slate-800 rounded-lg flex items-center justify-center text-center text-gray-400 text-sm">
          Espacio Publicitario<br>300 x 600 px
        </div>
      </div>
    </aside>

  </main>

  <script>
    const SUPABASE_URL = 'https://aiymadawznadvavzspxj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fL7vTXJ4NLhC2CJs9nPVAg_fvzWbfCY'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }

    function formatCompactTime(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffInSeconds = Math.floor((now - date) / 1000);

      if (diffInSeconds < 60) return `${Math.max(1, diffInSeconds)}s`;
      const diffInMinutes = Math.floor(diffInSeconds / 60);
      if (diffInMinutes < 60) return `${diffInMinutes} min`;
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `${diffInHours}h`;

      const months = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sept.', 'oct.', 'nov.', 'dic.'];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();

      if (year === now.getFullYear()) return `${day} ${month}`;
      return `${day} ${month} ${year}`;
    }

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      document.getElementById('userStatus').textContent = user.email;
      
      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
      document.getElementById('myProfileLink').href = `perfil.html?user=${encodeURIComponent(authorName)}`;

      loadPosts();
    }

    async function loadPosts() {
      const { data: posts, error } = await supabaseClient
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      const feed = document.getElementById('feed');
      if (error || !posts.length) {
        feed.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 bg-white dark:bg-slate-900 p-6 rounded-xl shadow border border-gray-200 dark:border-slate-800">No hay publicaciones aún. ¡Sé el primero!</p>';
        return;
      }

      feed.innerHTML = posts.map(post => {
        const author = post.user_name || 'Usuario';
        const compactTime = formatCompactTime(post.created_at);
        const avatarUrl = post.avatar_url || `https://ui-avatars.io/api/?name=${encodeURIComponent(author)}&background=random`;

        return `
          <div id="post-${post.id}" class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800 space-y-3">
            <div class="flex items-center space-x-3">
              <a href="perfil.html?user=${encodeURIComponent(author)}">
                <img src="${avatarUrl}" class="w-10 h-10 rounded-full object-cover border border-gray-300 dark:border-slate-700 hover:opacity-80 transition cursor-pointer" alt="${author}">
              </a>
              <div class="flex items-center space-x-2">
                <a href="perfil.html?user=${encodeURIComponent(author)}" class="font-bold text-gray-900 dark:text-white text-sm hover:underline">
                  ${author}
                </a>
                <span class="text-gray-400 text-sm">·</span>
                <span class="text-sm text-gray-500 dark:text-gray-400">${compactTime}</span>
              </div>
            </div>

            ${post.content ? `<p class="text-gray-800 dark:text-gray-200 text-sm">${post.content}</p>` : ''}
            ${post.image_url ? `<img src="${post.image_url}" class="w-full rounded-lg max-h-96 object-cover" alt="Imagen de publicación">` : ''}
            
            <div class="flex items-center space-x-4 border-t border-gray-100 dark:border-slate-800 pt-2 text-sm text-gray-600 dark:text-gray-400">
              <button onclick="likePost(${post.id}, ${post.likes || 0})" class="hover:text-blue-600 font-semibold transition">
                ❤️ <span id="likes-count-${post.id}">${post.likes || 0}</span> Likes
              </button>
              <button onclick="sharePost('${post.content || ''}')" class="hover:text-blue-600 font-semibold">
                🔗 Compartir
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('btnPublish').addEventListener('click', async () => {
      const content = document.getElementById('postContent').value.trim();
      const fileInput = document.getElementById('postImage');
      const file = fileInput.files[0];

      if (!content && !file) return alert('Escribe algo o selecciona una imagen.');

      // UI OPTIMISTA: Limpiamos campos de inmediato para dar sensación instantánea
      document.getElementById('postContent').value = '';
      fileInput.value = '';

      let imageUrl = null;
      if (file) {
        const filePath = `${Date.now()}_${file.name}`;
        const { error: uploadError } = await supabaseClient.storage
          .from('posts-images')
          .upload(filePath, file);

        if (uploadError) {
          alert('Error al subir imagen: ' + uploadError.message);
          return;
        }

        const { data: publicUrlData } = supabaseClient.storage
          .from('posts-images')
          .getPublicUrl(filePath);

        imageUrl = publicUrlData.publicUrl;
      }

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
      
      const { error } = await supabaseClient.from('posts').insert([
        { user_email: currentUser.email, user_name: authorName, content: content, image_url: imageUrl, likes: 0 }
      ]);

      if (error) alert('Error al publicar: ' + error.message);
      else {
        loadPosts(); // Refresca de fondo silenciosamente
      }
    });

    // LIKE OPTIMISTA INSTANTÁNEO (Suma el like en pantalla al instante sin esperar latencia de red)
    async function likePost(id, currentLikes) {
      const newLikes = currentLikes + 1;
      const counterElement = document.getElementById(`likes-count-${id}`);
      if (counterElement) counterElement.textContent = newLikes;

      // Actualizamos en segundo plano en Supabase
      await supabaseClient.from('posts').update({ likes: newLikes }).eq('id', id);
    }

    function sharePost(text) {
      if (navigator.share) {
        navigator.share({ title: 'WorlDigi', text: text, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Enlace copiado al portapapeles.');
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }

    init();
  </script>
</body>
</html>
