  <script>
    const SUPABASE_URL = 'https://aiymadawznadvavzspxj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fL7vTXJ4NLhC2CJs9nPVAg_fvzWbfCY'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    // ===== SISTEMA DE PUBLICIDAD =====
    // Selecciona un anuncio activo por bloque horario y cambia automáticamente
    // al comenzar la siguiente hora. El <img> arranca oculto y sin src para no
    // mostrar otro banner mientras carga; se pinta primero desde caché local y
    // luego se refresca con Supabase. Si todo falla, usa el banner local.
    const BYGETHER_AD_DEFAULT = 'assets/bygether-ad-300x600.svg';
    const BYGETHER_AD_CACHE_KEY = 'bygether_ads_cache_v1';
    let bygetherAdvertisements = [];
    let bygetherAdTimer = null;

    function paintByGetherAd(ad) {
      const image = document.getElementById('advertisementImage');
      const link = document.getElementById('advertisementLink');
      if (!image || !link) return;
      const url = (ad && ad.image_url) ? ad.image_url : BYGETHER_AD_DEFAULT;
      if (ad && ad.target_url) link.href = ad.target_url;
      if (image.getAttribute('src') === url) { image.style.visibility = 'visible'; return; }
      image.dataset.want = url; // evita que una carga lenta pise a una más reciente
      const pre = new Image();
      pre.onload = () => { if (image.dataset.want !== url) return; image.src = url; image.style.visibility = 'visible'; };
      pre.onerror = () => { if (image.dataset.want !== url) return; image.src = BYGETHER_AD_DEFAULT; image.style.visibility = 'visible'; };
      pre.src = url;
    }

    function pickByGetherAd(list) {
      if (!Array.isArray(list) || !list.length) return null;
      return list[Math.floor(Date.now() / 3600000) % list.length];
    }

    function scheduleByGetherAd() {
      if (bygetherAdTimer) clearTimeout(bygetherAdTimer);
      const nextHour = 3600000 - (Date.now() % 3600000) + 1000;
      bygetherAdTimer = setTimeout(loadByGetherAdvertisement, nextHour);
    }

    async function loadByGetherAdvertisement() {
      // 1) Pintar al instante desde caché (evita parpadeo y banner equivocado)
      try {
        const cached = JSON.parse(localStorage.getItem(BYGETHER_AD_CACHE_KEY) || 'null');
        const ad = pickByGetherAd(cached);
        if (ad) paintByGetherAd(ad);
      } catch (e) { /* sin caché */ }

      // 2) Refrescar desde Supabase
      try {
        const { data, error } = await supabaseClient
          .from('advertisements')
          .select('id, image_url, target_url')
          .eq('activo', true)
          .order('id', { ascending: true });

        if (error) throw error;
        bygetherAdvertisements = Array.isArray(data) ? data : [];

        try { localStorage.setItem(BYGETHER_AD_CACHE_KEY, JSON.stringify(bygetherAdvertisements)); } catch (e) {}

        paintByGetherAd(pickByGetherAd(bygetherAdvertisements)); // sin anuncios activos => banner local
      } catch (error) {
        console.warn('No se pudo cargar la publicidad administrable:', error);
        const image = document.getElementById('advertisementImage');
        if (image && image.style.visibility === 'hidden') paintByGetherAd(null);
      } finally {
        scheduleByGetherAd(); // siempre reprograma el cambio de hora
      }
    }

    loadByGetherAdvertisement();


    // ===== BLOQUEO DE CONTENIDO POR SESIÓN (evita el "destello" del muro) =====
    // El body arranca oculto (ver <style> en el <head>, clase auth-pending).
    // Solo se revela una vez confirmada una sesión real.
    function hideForAuth() {
      document.documentElement.classList.add('auth-pending');
    }
    function revealApp() {
      document.documentElement.classList.remove('auth-pending');
    }

    const BYGETHER_AUTH_KEY = 'sb-aiymadawznadvavzspxj-auth-token';

    // Vuelve a la landing dejando una marca de un solo uso para que index.html
    // no reenvíe de inmediato al dashboard (evita el bucle).
    // clearSession = true solo cuando se CONFIRMÓ que no hay sesión real.
    function bounceToLanding(clearSession) {
      try {
        if (clearSession) localStorage.removeItem(BYGETHER_AUTH_KEY);
        sessionStorage.setItem('bygether_session_bounce', '1');
      } catch (e) {}
      window.location.replace('index.html');
    }

    // Justo antes de que esta página se congele en el caché de retroceso
    // del navegador (bfcache) -por cualquier motivo, incluido cerrar sesión-
    // la volvemos a ocultar. Así, si más tarde se restaura con "atrás", la
    // "foto" guardada ya está oculta y nunca llega a pintarse el muro.
    function saveDashboardState() {
      const feed = document.getElementById('feed');
      const container = document.getElementById('feedScrollContainer');
      if (!feed || !container || !currentUser) return;
      try {
        sessionStorage.setItem('bygether_dashboard_state', JSON.stringify({
          userEmail: currentUser.email,
          feedMode,
          feedOffset,
          feedHasMore,
          feedPostsById,
          feedRecentShownIds,
          feedHtml: feed.innerHTML,
          scrollTop: window.innerWidth < 1024 ? window.scrollY : container.scrollTop
        }));
      } catch (err) {
        console.warn('No se pudo guardar el estado del dashboard:', err);
      }
    }

    window.addEventListener('pagehide', () => {
      saveDashboardState();
      hideForAuth();
    });

    // Cada vez que la página se muestra (carga normal o restaurada desde
    // bfcache) verificamos la sesión real antes de revelar el contenido.
    window.addEventListener('pageshow', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        bounceToLanding(true);
        return;
      }

async function loadPosts(isLoadMore = false) {
  if (feedMode === 'reciente') return loadRecentPosts(isLoadMore);
  return loadFeaturedPosts(isLoadMore);
}

function showFeedLoader() {
  const feed = document.getElementById('feed');
  if (!feed || document.getElementById('feedLoadingIndicator')) return;
  feed.insertAdjacentHTML('beforeend', `
    <div id="feedLoadingIndicator">
      <svg class="tadpole-spinner" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tadpoleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="currentColor" stop-opacity="0"/>
            <stop offset="100%" stop-color="currentColor" stop-opacity="1"/>
          </linearGradient>
        </defs>
        <circle cx="22" cy="22" r="18" stroke="url(#tadpoleGradient)" stroke-width="4" stroke-linecap="round" stroke-dasharray="85 113"/>
      </svg>
    </div>
  `);
}

function hideFeedLoader() {
  const el = document.getElementById('feedLoadingIndicator');
  if (el) el.remove();
}

async function loadMorePosts() {
  if (feedIsLoadingMore || !feedHasMore) return;
  const requestGeneration = feedRequestGeneration;
  feedIsLoadingMore = true;
  showFeedLoader();
  await loadPosts(true);
  if (requestGeneration !== feedRequestGeneration) {
    hideFeedLoader();
    return;
  }
  hideFeedLoader();
  feedIsLoadingMore = false;
}

  const container = document.getElementById('feedScrollContainer');
  if (container && container.scrollHeight > container.clientHeight + 10) {
    return (container.scrollTop + container.clientHeight) >= (container.scrollHeight - 1300);
  }
  return (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 1300);
}

function handleFeedScroll() {
  if (feedRestoringState || feedIsLoadingMore || !feedHasMore) return;
  if (isNearFeedBottom()) loadMorePosts();
}

window.addEventListener('scroll', handleFeedScroll);

    async function publishPost({ contentId, fileId, previewId, buttonId, isModal }) {
      const contentEl = document.getElementById(contentId);
      const fileInput = document.getElementById(fileId);
      const content = contentEl.value.trim();
      const file = fileInput.files[0];

      if (!content && !file) return alert('Escribe algo o selecciona una imagen.');

      // UI OPTIMISTA: Limpiamos campos de inmediato para dar sensación instantánea
      contentEl.value = '';
      fileInput.value = '';
      if (previewId) document.getElementById(previewId).textContent = '';
      if (buttonId) document.getElementById(buttonId).disabled = true;

      let imageUrl = null;
      if (file) {
        const filePath = `${Date.now()}_${file.name}`;
        const { error: uploadError } = await supabaseClient.storage
          .from('posts-images')
          .upload(filePath, file);

        if (uploadError) {
          alert('Error al subir imagen: ' + uploadError.message);
          return;
        }

        const { data: publicUrlData } = supabaseClient.storage
          .from('posts-images')
          .getPublicUrl(filePath);

        imageUrl = publicUrlData.publicUrl;
      }

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];

      const { error } = await supabaseClient.from('posts').insert([
        { user_email: currentUser.email, user_name: authorName, content: content, image_url: imageUrl, likes: 0 }
      ]);

      if (error) {
        alert('Error al publicar: ' + error.message);
        return;
      }

      loadPosts(); // Refresca de fondo silenciosamente
      if (isModal) closeComposerModal();
      showToast('Tu mensaje se envió');
    }

    async function openQuoteComposer(postId) {
      closeMobileRepostSheet();
      quoteComposerPostId = postId;

      const modal = document.getElementById('quoteComposerModal');
      const body = document.getElementById('quoteComposerBody');
      const input = document.getElementById('quoteComposerText');
      const avatar = document.getElementById('quoteComposerAvatar');
      if (!modal || !body || !input) return;

      if (myAvatarUrl) {
        avatar.src = myAvatarUrl;
        avatar.classList.add('is-loaded');
      } else {
        avatar.removeAttribute('src');
        avatar.classList.remove('is-loaded');
      }

      input.value = '';
      body.innerHTML = '<div class="text-sm text-gray-500 dark:text-gray-400 text-center py-6">Cargando publicación...</div>';
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      let { data: post, error } = await supabaseClient
        .from('posts')
        .select('*')
        .eq('id', postId)
        .single();

      if (error || !post) {
        body.innerHTML = '<div class="text-sm text-red-500 text-center py-6">No se pudo cargar la publicación.</div>';
        return;
      }

      let resolvedPost = post;
      const visitedQuotePosts = new Set();
      while (resolvedPost.repost_of && !visitedQuotePosts.has(resolvedPost.id)) {
        visitedQuotePosts.add(resolvedPost.id);
        const { data: nextPost, error: nextError } = await supabaseClient
          .from('posts')
          .select('*')
          .eq('id', resolvedPost.repost_of)
          .single();
        if (nextError || !nextPost) break;
        resolvedPost = nextPost;
      }
      post = resolvedPost;

      const author = post.user_name || 'Usuario';
      const { data: authorProfile } = await supabaseClient
        .from('profiles')
        .select('avatar_url')
        .or(`user_email.eq.${post.user_email},user_name.eq.${author}`)
        .limit(1)
        .maybeSingle();
      const authorAvatar = authorProfile?.avatar_url || post.avatar_url ||
        `https://ui-avatars.com/api/?name=${encodeURIComponent(author)}&background=random`;

      body.innerHTML = `
        <div class="border border-gray-200 dark:border-slate-700 rounded-xl p-3">
          <div class="flex items-center gap-2 mb-2">
            <img src="${connEscape(authorAvatar)}" class="w-8 h-8 rounded-full object-cover flex-shrink-0" alt="">
            <div class="min-w-0">
              <div class="font-bold text-sm text-gray-900 dark:text-white truncate">${connEscape(author)}</div>
              <div class="text-xs text-gray-400">${formatCompactTime(post.created_at)}</div>
            </div>
          </div>
          ${post.content ? `<p class="text-sm text-gray-800 dark:text-gray-200 break-words whitespace-pre-line">${linkifyContent(ytStripLink(post.content))}</p>` : ''}
          ${ytEmbedsFor(post.content || '')}
          ${post.image_url && !ytOwnsImage(post.content || '', post.image_url) ? `<img src="${connEscape(post.image_url)}" class="w-full rounded-lg max-h-72 object-cover mt-3" alt="Imagen de publicación">` : ''}
        </div>
      `;
    }

    async function loadComments(postId) {
      const container = document.getElementById('postViewerComments');
      container.innerHTML = '<p class="text-sm text-gray-400 text-center">Cargando comentarios...</p>';

      const { data: comments, error } = await supabaseClient
        .from('comments')
        .select('*')
        .eq('post_id', postId)
        .order('created_at', { ascending: true });

      if (error || !comments || !comments.length) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center">Aún no hay comentarios. ¡Sé el primero!</p>';
        if (!error) ccSetCount(postId, 0);
        return;
      }

      ccSetCount(postId, comments.length);

      // Fotos de perfil de quienes comentaron (por su correo); quien no tiene foto conserva su avatar de iniciales
      const commenterEmails = [...new Set(comments.map(c => c.user_email).filter(Boolean))];
      const commentAvatarByEmail = {};
      if (commenterEmails.length) {
        const { data: commenterProfiles } = await supabaseClient
          .from('profiles')
          .select('user_email, avatar_url')
          .in('user_email', commenterEmails);
        (commenterProfiles || []).forEach(p => { if (p.avatar_url) commentAvatarByEmail[p.user_email] = p.avatar_url; });
      }

      container.innerHTML = comments.map(c => `
        <div class="flex items-start gap-2">
          <img src="${connEscape(commentAvatarByEmail[c.user_email] || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(c.user_name) + '&background=random'))}" class="w-8 h-8 rounded-full object-cover flex-shrink-0">
          <div class="bg-gray-100 dark:bg-slate-800 rounded-xl px-3 py-2 flex-1">
            <div class="text-xs font-bold text-gray-900 dark:text-white" data-user-card="${connEscape(c.user_name)}">${connEscape(c.user_name)}</div>
            <div class="text-sm text-gray-700 dark:text-gray-200 break-words">${c.content}</div>
          </div>
        </div>
      `).join('');

      container.scrollTop = container.scrollHeight;
    }

    function updateCharCount() {
      const input = document.getElementById('postViewerCommentInput');
      const counter = document.getElementById('postViewerCharCount');
      const remaining = 280 - input.value.length;
      counter.textContent = remaining;
      counter.classList.toggle('text-red-500', remaining < 0);
      document.getElementById('postViewerSubmitBtn').disabled = remaining < 0 || input.value.trim().length === 0;
    }

    async function submitComment() {
      const input = document.getElementById('postViewerCommentInput');
      const content = input.value.trim();
      if (!content || content.length > 280 || !currentViewerPostId) return;

      if (!currentUser) {
        alert('Debes iniciar sesión para comentar.');
        return;
      }

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];

      const { error } = await supabaseClient.from('comments').insert({
        post_id: currentViewerPostId,
        user_email: currentUser.email,
        user_name: authorName,
        content: content
      });

      if (error) {
        alert('Error al comentar: ' + error.message);
        return;
      }

      input.value = '';
      updateCharCount();
      await loadComments(currentViewerPostId);
    }

    // ===== SCROLL CENTRAL GLOBAL EN ESCRITORIO =====
    // El cursor puede estar sobre cualquier columna del dashboard: la rueda
    // desplaza siempre la columna central, sin volver a habilitar el scroll del body.
    window.addEventListener('wheel', (event) => {
      if (window.innerWidth < 1024) return;
      const main = document.querySelector('main');
      const center = main?.querySelector(':scope > div');
      if (!main || !center || !main.contains(event.target)) return;

      // Ctrl + rueda = zoom nativo del navegador. No interceptarlo.
      // Rueda normal = desplazar exclusivamente la columna central.
      if (event.ctrlKey) return;
      if (Math.abs(event.deltaY) > 0) {
        center.scrollTop += event.deltaY;
        event.preventDefault();
      }
    }, { passive: false });

    init();

        <button id="btnPublishModal" disabled class="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:hover:bg-blue-600 disabled:cursor-not-allowed text-white font-bold py-2 px-6 rounded-lg transition">Publicar</button>
      </div>
    </div>
  </div>

  <!-- Hoja móvil: Repostear / Citar -->
  <div id="mobileRepostSheet" class="hidden fixed inset-0 z-[120] items-end bg-black/60" onclick="if(event.target===this) closeMobileRepostSheet()">
    <div class="bygether-sheet-in w-full bg-white dark:bg-slate-900 rounded-t-2xl border-t border-gray-200 dark:border-slate-700 shadow-2xl p-3 pb-5">
      <div class="w-10 h-1 rounded-full bg-gray-300 dark:bg-slate-700 mx-auto mb-4"></div>
      <button id="mobileRepostAction" class="w-full px-4 py-4 text-left text-gray-900 dark:text-white rounded-xl hover:bg-gray-100 dark:hover:bg-slate-800 transition font-semibold">
        Repostear ahora
      </button>
      <button onclick="openQuoteComposer(mobileRepostPostId)" class="w-full px-4 py-4 text-left text-gray-900 dark:text-white rounded-xl hover:bg-gray-100 dark:hover:bg-slate-800 transition font-semibold">
        Citar publicación
      </button>
      <button onclick="closeMobileRepostSheet()" class="w-full mt-1 px-4 py-3 rounded-xl text-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-800 transition">
        Cancelar
      </button>
    </div>
  </div>

  <!-- Compositor de cita -->
  <div id="quoteComposerModal" class="hidden fixed inset-0 z-[130] bg-black/70 items-end md:items-center justify-center p-0 md:p-4" onclick="closeQuoteComposerBackdrop(event)">
    <div class="w-full md:max-w-2xl bg-white dark:bg-slate-900 rounded-t-2xl md:rounded-xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-slate-800">
        <h2 class="font-bold text-gray-900 dark:text-white">Citar publicación</h2>
        <button onclick="closeQuoteComposer()" class="text-2xl leading-none text-gray-500 hover:text-gray-900 dark:hover:text-white">&times;</button>
      </div>
      <div class="overflow-y-auto p-4 space-y-4">
        <div class="flex items-start gap-3">
          <img id="quoteComposerAvatar" class="avatar-image w-10 h-10 rounded-full object-cover border border-gray-300 dark:border-slate-700 flex-shrink-0" alt="Tu avatar">
          <textarea id="quoteComposerText" maxlength="280" rows="4" placeholder="Añade tu comentario..." class="flex-1 w-full min-h-[96px] resize-none rounded-xl border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-gray-900 dark:text-gray-100 p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div id="quoteComposerBody"></div>
      </div>
      <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-gray-200 dark:border-slate-800">
        <button onclick="closeQuoteComposer()" class="px-4 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-800 transition">Cancelar</button>
        <button onclick="submitQuote()" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold transition">Citar</button>
      </div>
    </div>
  </div>

  <!-- Mensaje flotante de confirmación -->
  <div id="toastMessage" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-600 text-white text-sm font-semibold px-5 py-3 rounded-lg shadow-lg z-[200] transition-opacity duration-500" style="opacity:0;">
    Tu mensaje se envió
  </div>

  <script src="composer-autogrow.js"></script>
  <script src="composer-counter.js"></script>
  <script src="mobile-nav.js"></script>
</body>
</html>
