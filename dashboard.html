  <script>
    const SUPABASE_URL = 'https://aiymadawznadvavzspxj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fL7vTXJ4NLhC2CJs9nPVAg_fvzWbfCY'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===== BLOQUEO DE CONTENIDO POR SESIÓN (evita el "destello" del muro) =====
    // El body arranca oculto (ver <style> en el <head>, clase auth-pending).
    // Solo se revela una vez confirmada una sesión real.
    function hideForAuth() {
      document.documentElement.classList.add('auth-pending');
    }
    function revealApp() {
      document.documentElement.classList.remove('auth-pending');
    }

    // Justo antes de que esta página se congele en el caché de retroceso
    // del navegador (bfcache) -por cualquier motivo, incluido cerrar sesión-
    // la volvemos a ocultar. Así, si más tarde se restaura con "atrás", la
    // "foto" guardada ya está oculta y nunca llega a pintarse el muro.
    window.addEventListener('pagehide', hideForAuth);

    // Cada vez que la página se muestra (carga normal o restaurada desde
    // bfcache) verificamos la sesión real antes de revelar el contenido.
    window.addEventListener('pageshow', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.replace('index.html');
        return;
      }
      revealApp();
    });

    let currentUser = null;
    let myAvatarUrl = null;
    let toastTimeout = null;

    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }

    function formatCompactTime(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffInSeconds = Math.floor((now - date) / 1000);

      if (diffInSeconds < 60) return `${Math.max(1, diffInSeconds)}s`;
      const diffInMinutes = Math.floor(diffInSeconds / 60);
      if (diffInMinutes < 60) return `${diffInMinutes} min`;
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `${diffInHours}h`;

      const months = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sept.', 'oct.', 'nov.', 'dic.'];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();

      if (year === now.getFullYear()) return `${day} ${month}`;
      return `${day} ${month} ${year}`;
    }

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.replace('index.html');
        return;
      }
      currentUser = user;
      
      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
      document.getElementById('myProfileLink').href = `perfil.html?user=${encodeURIComponent(authorName)}`;

      const { data: myProfileRow } = await supabaseClient
        .from('profiles')
        .select('avatar_url')
        .eq('user_name', authorName)
        .maybeSingle();

      myAvatarUrl = myProfileRow?.avatar_url ||
        `https://ui-avatars.com/api/?name=${encodeURIComponent(authorName)}&background=random`;

      document.getElementById('composerAvatar').src = myAvatarUrl;

      initNotifications(currentUser.email);
      loadPosts();
    }
    function linkifyContent(text) { if (!text) return ''; const urlRegex = /(https?:\/\/[^\s]+)/g; return text.replace(urlRegex, (url) => { let domain; try { domain = new URL(url).hostname.replace('www.', ''); } catch (e) { domain = url; } return `<a href="${url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="inline-flex items-center gap-1 text-green-600 dark:text-green-400 font-semibold hover:underline align-middle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 inline-block"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>${domain}</a>`; }); }
   async function loadPosts() {
  const { data: posts, error } = await supabaseClient
    .from('posts')
    .select('*')
    .order('created_at', { ascending: false });
     const { data: profiles } = await supabaseClient .from('profiles') .select('user_name, avatar_url'); const avatarByUser = {}; (profiles || []).forEach(p => { avatarByUser[p.user_name] = p.avatar_url; });
     const channelSet = await connFetchChannelSet();

  const feed = document.getElementById('feed');

  if (error || !posts || !posts.length) {
    feed.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 bg-white dark:bg-slate-900 p-6 rounded-xl shadow border border-gray-200 dark:border-slate-800">No hay publicaciones aún. ¡Sé el primero!</p>';
    return;
  }

  // Creamos un índice para encontrar rápidamente la publicación original
  const postsById = {};
  posts.forEach(post => {
    postsById[post.id] = post;
  });

  // Publicaciones que el usuario actual ya reposteó (sin cita), para pintar el botón en verde
  const myPlainReposts = new Set(
    posts
      .filter(p => p.repost_of && p.user_email === currentUser.email && !p.quote_text)
      .map(p => p.repost_of)
  );

  // Cantidad de comentarios de cada publicación (una sola consulta)
  const commentCounts = await ccFetchCounts(posts.map(p => p.id));
  const repostCounts = await ccFetchRepostCounts(posts.map(p => p.id));
  const myLikes = await ccFetchMyLikes(posts.map(p => p.id), currentUser.email);
  const likerName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];

  // Si alguien reposteó/citó un comentario, traemos ese comentario para mostrarlo dentro de la tarjeta
  const commentRepostIds = [...new Set(posts.filter(p => p.repost_of_comment_id).map(p => p.repost_of_comment_id))];
  const commentsById = {};
  if (commentRepostIds.length) {
    const { data: quotedComments } = await supabaseClient.from('comments').select('*').in('id', commentRepostIds);
    (quotedComments || []).forEach(c => { commentsById[c.id] = c; });
  }

  feed.innerHTML = posts.map(post => {

    // Repost/cita de un comentario: tarjeta propia (el comentario original + like/comentario/compartir)
    if (post.repost_of_comment_id) {
      const c = commentsById[post.repost_of_comment_id];
      if (!c) return '';
      const cAuthor = c.user_name || 'Usuario';
      const cAvatar = avatarByUser[cAuthor] || `https://ui-avatars.com/api/?name=${encodeURIComponent(cAuthor)}&background=random`;
      const author = post.user_name || 'Usuario';
      return `
        <div id="post-${post.id}" class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800 space-y-3">
          <div class="flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400 font-semibold">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 flex-shrink-0 text-green-600"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
            <span data-user-card="${connEscape(author)}" class="hover:underline">${connEscape(author)}</span> ${post.quote_text ? 'citó un comentario' : 'reposteó un comentario'}
          </div>
          ${post.quote_text ? `<p class="text-sm text-gray-800 dark:text-gray-200 break-words whitespace-pre-line">${linkifyContent(post.quote_text)}</p>` : ''}
          <a href="publicacion.html?id=${c.post_id}#comentario-${c.id}" class="block border border-gray-200 dark:border-slate-700 rounded-xl p-3 hover:bg-gray-50 dark:hover:bg-slate-800 transition">
            <div class="flex items-center gap-2 mb-1">
              <img src="${connEscape(cAvatar)}" class="w-6 h-6 rounded-full object-cover flex-shrink-0" alt="${connEscape(cAuthor)}">
              <span class="font-bold text-sm text-gray-900 dark:text-white">${connEscape(cAuthor)}</span>
              <span class="text-xs text-gray-400">· ${formatCompactTime(c.created_at)}</span>
            </div>
            <p class="text-sm text-gray-700 dark:text-gray-300 break-words whitespace-pre-line">${linkifyContent(c.content)}</p>
          </a>
          <div class="flex items-center space-x-5 border-t border-gray-100 dark:border-slate-800 pt-2 text-sm text-gray-600 dark:text-gray-400">
            ${ccLikeButtonHtml(post.id, post.likes, myLikes.has(post.id), currentUser.email, likerName)}
            <button onclick="commentPost(${post.id})" title="Comentar" class="flex items-center gap-1.5 hover:text-blue-600 font-semibold transition">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"></path></svg>
              <span id="comments-count-${post.id}">${commentCounts[post.id] || 0}</span>
            </button>
            <button onclick="sharePost(${JSON.stringify(post.quote_text || c.content || '')})" title="Compartir" class="hover:text-blue-600 font-semibold transition">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>

    function updatePublishState(textareaId, buttonId) {
      const textarea = document.getElementById(textareaId);
      const button = document.getElementById(buttonId);
      if (!textarea || !button) return;
      button.disabled = textarea.value.trim().length === 0;
    }

    function updateFileNamePreview(inputId, previewId) {
      const input = document.getElementById(inputId);
      const preview = document.getElementById(previewId);
      if (!input || !preview) return;
      preview.textContent = input.files[0] ? input.files[0].name : '';
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMessage');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.remove('hidden');
      requestAnimationFrame(() => { toast.style.opacity = '1'; });
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.classList.add('hidden'), 400);
      }, 2500);
    }

    function openComposerModal() {
      document.getElementById('postContentModal').value = '';
      document.getElementById('postImageModal').value = '';
      document.getElementById('postImagePreviewModal').textContent = '';
      document.getElementById('composerAvatarModal').src = myAvatarUrl || '';
      document.getElementById('btnPublishModal').disabled = true;

      const modal = document.getElementById('composerModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeComposerModal() {
      const modal = document.getElementById('composerModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function closeComposerModalBackdrop(e) {
      if (e.target.id === 'composerModal') closeComposerModal();
    }

    async function publishPost({ contentId, fileId, previewId, buttonId, isModal }) {
      const contentEl = document.getElementById(contentId);
      const fileInput = document.getElementById(fileId);
      const content = contentEl.value.trim();
      const file = fileInput.files[0];

      if (!content && !file) return alert('Escribe algo o selecciona una imagen.');

      // UI OPTIMISTA: Limpiamos campos de inmediato para dar sensación instantánea
      contentEl.value = '';
      fileInput.value = '';
      if (previewId) document.getElementById(previewId).textContent = '';
      if (buttonId) document.getElementById(buttonId).disabled = true;

      let imageUrl = null;
      if (file) {
        const filePath = `${Date.now()}_${file.name}`;
        const { error: uploadError } = await supabaseClient.storage
          .from('posts-images')
          .upload(filePath, file);

        if (uploadError) {
          alert('Error al subir imagen: ' + uploadError.message);
          return;
        }

        const { data: publicUrlData } = supabaseClient.storage
          .from('posts-images')
          .getPublicUrl(filePath);

        imageUrl = publicUrlData.publicUrl;
      }

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];

      const { error } = await supabaseClient.from('posts').insert([
        { user_email: currentUser.email, user_name: authorName, content: content, image_url: imageUrl, likes: 0 }
      ]);

      if (error) {
        alert('Error al publicar: ' + error.message);
        return;
      }

      loadPosts(); // Refresca de fondo silenciosamente
      if (isModal) closeComposerModal();
      showToast('Tu mensaje se envió');
    }

    document.getElementById('btnPublish').addEventListener('click', () => {
      publishPost({ contentId: 'postContent', fileId: 'postImage', previewId: 'postImagePreview', buttonId: 'btnPublish', isModal: false });
    });

    document.addEventListener('DOMContentLoaded', () => {
      const btnModal = document.getElementById('btnPublishModal');
      if (btnModal) {
        btnModal.addEventListener('click', () => {
          publishPost({ contentId: 'postContentModal', fileId: 'postImageModal', previewId: 'postImagePreviewModal', buttonId: 'btnPublishModal', isModal: true });
        });
      }
    });

    function toggleRepostMenu(postId) {
     const menu = document.getElementById(`repost-menu-${postId}`);

      if (!menu) return;

      // Cierra cualquier otro menú de repost que haya quedado abierto
      document.querySelectorAll('[id^="repost-menu-"]').forEach(m => {
        if (m !== menu) m.classList.add('hidden');
      });

  menu.classList.toggle('hidden');
   }

    // Cierra el menú de repost si el usuario hace clic en cualquier otro lugar
    document.addEventListener('click', (e) => {
      const isToggleButton = e.target.closest('[data-repost-toggle]');
      const isInsideMenu = e.target.closest('[id^="repost-menu-"]');
      if (!isToggleButton && !isInsideMenu) {
        document.querySelectorAll('[id^="repost-menu-"]').forEach(menu => menu.classList.add('hidden'));
      }
    });

    function commentPost(postId) {
      openCommentModal(postId);
    }

    // Al hacer clic en el texto de una publicación se abre su propia página (publicación + comentarios).
    // Si el usuario estaba seleccionando texto, no se abre.
    function openPostPage(postId) {
      if (window.getSelection && String(window.getSelection()).length) return;
      window.location.href = 'publicacion.html?id=' + encodeURIComponent(postId);
    }

   async function repostPost(postId) {
  const authorName =
    currentUser.user_metadata?.full_name ||
    currentUser.email.split('@')[0];

  const { error } = await supabaseClient
    .from('posts')
    .insert([
      {
        user_email: currentUser.email,
        user_name: authorName,
        content: null,
        image_url: null,
        likes: 0,
        repost_of: postId,
        quote_text: null
      }
    ]);

  if (error) {
    console.error(error);
    return;
  }

  toggleRepostMenu(postId);
  loadPosts();
}

    async function undoRepost(postId) {
      const { error } = await supabaseClient
        .from('posts')
        .delete()
        .eq('repost_of', postId)
        .eq('user_email', currentUser.email)
        .is('quote_text', null);

      if (error) {
        console.error(error);
        return;
      }

      toggleRepostMenu(postId);
      loadPosts();
    }

    async function quotePost(postId) {
      const quoteText = prompt('Escribe tu cita para este repost:');
      if (quoteText === null) return;

      const authorName =
        currentUser.user_metadata?.full_name ||
        currentUser.email.split('@')[0];

      const { error } = await supabaseClient
        .from('posts')
        .insert([
          {
            user_email: currentUser.email,
            user_name: authorName,
            content: null,
            image_url: null,
            likes: 0,
            repost_of: postId,
            quote_text: quoteText.trim() || null
          }
        ]);

      if (error) {
        console.error(error);
        return;
      }

      toggleRepostMenu(postId);
      loadPosts();
    }

    function sharePost(text) {
      if (navigator.share) {
        navigator.share({ title: 'ByGether', text: text, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Enlace copiado al portapapeles.');
      }
    }

    async function logout() {
      hideForAuth();
      await supabaseClient.auth.signOut();
      window.location.replace('index.html');
    }

    // ===== VISOR DE POST + COMENTARIOS =====
    let currentViewerPostId = null;

    async function openPostViewer(postId) {
      currentViewerPostId = postId;

      const { data: post, error } = await supabaseClient
        .from('posts')
        .select('*')
        .eq('id', postId)
        .single();

      if (error || !post) return;

      const { data: profileRow } = await supabaseClient
        .from('profiles')
        .select('avatar_url')
        .eq('user_name', post.user_name)
        .maybeSingle();

      const avatarUrl = profileRow?.avatar_url || post.avatar_url ||
        `https://ui-avatars.com/api/?name=${encodeURIComponent(post.user_name || 'Usuario')}&background=random`;

      document.getElementById('postViewerAvatar').src = avatarUrl;
      document.getElementById('postViewerAuthor').textContent = post.user_name || 'Usuario';
      document.getElementById('postViewerAuthor').setAttribute('data-user-card', post.user_name || '');
      document.getElementById('postViewerTime').textContent = formatCompactTime(post.created_at);
      document.getElementById('postViewerContent').innerHTML = post.content ? linkifyContent(post.content) : '';

      const imageWrap = document.getElementById('postViewerImageWrap');
      if (post.image_url) {
        document.getElementById('postViewerImage').src = post.image_url;
        imageWrap.classList.remove('hidden');
      } else {
        imageWrap.classList.add('hidden');
      }

      const input = document.getElementById('postViewerCommentInput');
      input.value = '';
      updateCharCount();

      await loadComments(postId);

      const viewer = document.getElementById('postViewer');
      viewer.classList.remove('hidden');
      viewer.classList.add('flex');
    }

    function closePostViewer() {
      const viewer = document.getElementById('postViewer');
      viewer.classList.add('hidden');
      viewer.classList.remove('flex');
      currentViewerPostId = null;
    }

    function closePostViewerBackdrop(e) {
      if (e.target.id === 'postViewer') closePostViewer();
    }

    async function loadComments(postId) {
      const container = document.getElementById('postViewerComments');
      container.innerHTML = '<p class="text-sm text-gray-400 text-center">Cargando comentarios...</p>';

      const { data: comments, error } = await supabaseClient
        .from('comments')
        .select('*')
        .eq('post_id', postId)
        .order('created_at', { ascending: true });

      if (error || !comments || !comments.length) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center">Aún no hay comentarios. ¡Sé el primero!</p>';
        if (!error) ccSetCount(postId, 0);
        return;
      }

      ccSetCount(postId, comments.length);

      // Fotos de perfil de quienes comentaron (por su correo); quien no tiene foto conserva su avatar de iniciales
      const commenterEmails = [...new Set(comments.map(c => c.user_email).filter(Boolean))];
      const commentAvatarByEmail = {};
      if (commenterEmails.length) {
        const { data: commenterProfiles } = await supabaseClient
          .from('profiles')
          .select('user_email, avatar_url')
          .in('user_email', commenterEmails);
        (commenterProfiles || []).forEach(p => { if (p.avatar_url) commentAvatarByEmail[p.user_email] = p.avatar_url; });
      }

      container.innerHTML = comments.map(c => `
        <div class="flex items-start gap-2">
          <img src="${connEscape(commentAvatarByEmail[c.user_email] || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(c.user_name) + '&background=random'))}" class="w-8 h-8 rounded-full object-cover flex-shrink-0">
          <div class="bg-gray-100 dark:bg-slate-800 rounded-xl px-3 py-2 flex-1">
            <div class="text-xs font-bold text-gray-900 dark:text-white" data-user-card="${connEscape(c.user_name)}">${connEscape(c.user_name)}</div>
            <div class="text-sm text-gray-700 dark:text-gray-200 break-words">${c.content}</div>
          </div>
        </div>
      `).join('');

      container.scrollTop = container.scrollHeight;
    }

    function updateCharCount() {
      const input = document.getElementById('postViewerCommentInput');
      const counter = document.getElementById('postViewerCharCount');
      const remaining = 280 - input.value.length;
      counter.textContent = remaining;
      counter.classList.toggle('text-red-500', remaining < 0);
      document.getElementById('postViewerSubmitBtn').disabled = remaining < 0 || input.value.trim().length === 0;
    }

    async function submitComment() {
      const input = document.getElementById('postViewerCommentInput');
      const content = input.value.trim();
      if (!content || content.length > 280 || !currentViewerPostId) return;

      if (!currentUser) {
        alert('Debes iniciar sesión para comentar.');
        return;
      }

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];

      const { error } = await supabaseClient.from('comments').insert({
        post_id: currentViewerPostId,
        user_email: currentUser.email,
        user_name: authorName,
        content: content
      });

      if (error) {
        alert('Error al comentar: ' + error.message);
        return;
      }

      input.value = '';
      updateCharCount();
      await loadComments(currentViewerPostId);
    }

    init();
  </script>

  <!-- Modal: Publicar (columna izquierda) -->
  <div id="composerModal" class="hidden fixed inset-0 bg-black/70 z-[110] items-center justify-center p-4" onclick="closeComposerModalBackdrop(event)">
    <div class="bg-white dark:bg-slate-900 rounded-xl shadow-lg w-full max-w-lg p-4 relative">
      <button onclick="closeComposerModal()" class="absolute top-3 right-3 text-2xl text-gray-500 hover:text-gray-800 dark:hover:text-white leading-none">&times;</button>

      <h2 class="text-lg font-bold mb-3 text-gray-900 dark:text-white pr-8">Crear Publicación</h2>

      <div class="flex items-start gap-3">
        <img id="composerAvatarModal" src="" class="w-10 h-10 rounded-full object-cover border border-gray-300 dark:border-slate-700 flex-shrink-0" alt="Tu avatar">
        <textarea id="postContentModal" maxlength="280" oninput="updatePublishState('postContentModal','btnPublishModal')" class="flex-1 w-full p-3 border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="¿Qué estás pensando?"></textarea>
      </div>

      <div class="flex items-center justify-between mt-3">
        <div class="flex items-center gap-2">
          <input type="file" id="postImageModal" accept="image/*" class="hidden" onchange="updateFileNamePreview('postImageModal','postImagePreviewModal')">
          <label for="postImageModal" class="cursor-pointer inline-flex items-center justify-center w-10 h-10 rounded-full bg-gray-100 dark:bg-slate-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-slate-700 transition" title="Adjuntar imagen">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          </label>
          <span id="postImagePreviewModal" class="text-xs text-gray-500 dark:text-gray-400 truncate max-w-[140px]"></span>
        </div>
        <button id="btnPublishModal" disabled class="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:hover:bg-blue-600 disabled:cursor-not-allowed text-white font-bold py-2 px-6 rounded-lg transition">Publicar</button>
      </div>
    </div>
  </div>

  <!-- Mensaje flotante de confirmación -->
  <div id="toastMessage" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-600 text-white text-sm font-semibold px-5 py-3 rounded-lg shadow-lg z-[200] transition-opacity duration-500" style="opacity:0;">
    Tu mensaje se envió
  </div>

  <script src="composer-autogrow.js"></script>
  <script src="composer-counter.js"></script>
  <script src="mobile-nav.js"></script>
</body>
</html>
