<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorlDigi - Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <nav class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
    <h1 class="text-xl font-bold">WorlDigi</h1>
    <span id="userStatus" class="text-sm text-gray-300">Cargando usuario...</span>
  </nav>

  <main class="max-w-2xl mx-auto mt-6 p-4">
    <!-- Formulario para publicar -->
    <div class="bg-white p-4 rounded-xl shadow mb-6">
      <h2 class="text-lg font-bold mb-3">Crear Publicación</h2>
      <textarea id="postContent" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="¿Qué estás pensando?"></textarea>
      
      <div class="flex items-center justify-between mt-3">
        <input type="file" id="postImage" accept="image/*" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        <button id="btnPublish" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition">Publicar</button>
      </div>
    </div>

    <!-- Contenedor del Muro de publicaciones -->
    <div id="feed" class="space-y-4">
      <p class="text-center text-gray-500">Cargando publicaciones...</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://aiymadawznadvavzspxj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fL7vTXJ4NLhC2CJs9nPVAg_fvzWbfCY'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // Función de tiempo comprimido (Tus 5 formatos exactos)
    function formatCompactTime(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffInSeconds = Math.floor((now - date) / 1000);

      if (diffInSeconds < 60) return `${Math.max(1, diffInSeconds)}s`;
      
      const diffInMinutes = Math.floor(diffInSeconds / 60);
      if (diffInMinutes < 60) return `${diffInMinutes} min`;
      
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `${diffInHours}h`;

      const months = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sept.', 'oct.', 'nov.', 'dic.'];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();

      if (year === now.getFullYear()) return `${day} ${month}`;
      return `${day} ${month} ${year}`;
    }

    // Verificar sesión al cargar
    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      document.getElementById('userStatus').textContent = user.email;
      loadPosts();
    }

    // Cargar publicaciones
    async function loadPosts() {
      const { data: posts, error } = await supabaseClient
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      const feed = document.getElementById('feed');
      if (error || !posts.length) {
        feed.innerHTML = '<p class="text-center text-gray-500">No hay publicaciones aún. ¡Sé el primero!</p>';
        return;
      }

      feed.innerHTML = posts.map(post => {
        const author = post.user_name || 'Usuario';
        const compactTime = formatCompactTime(post.created_at);
        // Generar un avatar por defecto usando la inicial del usuario si no tiene imagen
        const avatarUrl = post.avatar_url || `https://ui-avatars.io/api/?name=${encodeURIComponent(author)}&background=random`;

        return `
          <div class="bg-white p-4 rounded-xl shadow space-y-3">
            <!-- Cabecera: Avatar circular, Nombre, Punto separador y Tiempo comprimido -->
            <div class="flex items-center space-x-3">
              <a href="perfil.html?user=${encodeURIComponent(author)}">
                <img src="${avatarUrl}" class="w-10 h-10 rounded-full object-cover border border-gray-300 hover:opacity-80 transition cursor-pointer">
              </a>
              <div class="flex items-center space-x-2">
                <a href="perfil.html?user=${encodeURIComponent(author)}" class="font-bold text-gray-900 text-sm hover:underline">
                  ${author}
                </a>
                <span class="text-gray-400 text-sm">·</span>
                <span class="text-sm text-gray-500">${compactTime}</span>
              </div>
            </div>

            <!-- Contenido y Multimedia -->
            ${post.content ? `<p class="text-gray-800 text-sm">${post.content}</p>` : ''}
            ${post.image_url ? `<img src="${post.image_url}" class="w-full rounded-lg max-h-96 object-cover">` : ''}
            
            <!-- Botones de Interacción -->
            <div class="flex items-center space-x-4 border-t pt-2 text-sm text-gray-600">
              <button onclick="likePost(${post.id}, ${post.likes || 0})" class="hover:text-blue-600 font-semibold">
                ❤️ ${post.likes || 0} Likes
              </button>
              <button onclick="sharePost('${post.content || ''}')" class="hover:text-blue-600 font-semibold">
                🔗 Compartir
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Publicar texto e imagen
    document.getElementById('btnPublish').addEventListener('click', async () => {
      const content = document.getElementById('postContent').value;
      const fileInput = document.getElementById('postImage');
      const file = fileInput.files[0];
      let imageUrl = null;

      if (!content && !file) return alert('Escribe algo o selecciona una imagen.');

      if (file) {
        const filePath = `${Date.now()}_${file.name}`;
        const { error: uploadError } = await supabaseClient.storage
          .from('posts-images')
          .upload(filePath, file);

        if (uploadError) return alert('Error al subir imagen: ' + uploadError.message);

        const { data: publicUrlData } = supabaseClient.storage
          .from('posts-images')
          .getPublicUrl(filePath);

        imageUrl = publicUrlData.publicUrl;
      }

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
      
      const { error } = await supabaseClient.from('posts').insert([
        { user_email: currentUser.email, user_name: authorName, content: content, image_url: imageUrl, likes: 0 }
      ]);

      if (error) alert('Error al publicar: ' + error.message);
      else {
        document.getElementById('postContent').value = '';
        fileInput.value = '';
        loadPosts();
      }
    });

    async function likePost(id, currentLikes) {
      await supabaseClient.from('posts').update({ likes: currentLikes + 1 }).eq('id', id);
      loadPosts();
    }

    function sharePost(text) {
      if (navigator.share) {
        navigator.share({ title: 'WorlDigi', text: text, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Enlace copiado al portapapeles.');
      }
    }

    init();
  </script>
</body>
</html>
