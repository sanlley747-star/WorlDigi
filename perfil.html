<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByKonet - Perfil de Usuario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 dark:bg-slate-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

  <nav class="sticky top-0 z-50 bg-slate-900 text-white p-4 flex justify-between items-center shadow-md border-b border-slate-800">
    <div class="flex items-center space-x-4">
      <a href="dashboard.html" class="text-blue-400 hover:underline text-sm font-semibold">&larr; Volver al Muro</a>
      <h1 class="text-xl font-bold">ByKonet</h1>
    </div>
    <div class="flex items-center space-x-4">
      <span id="profileTitle" class="text-sm text-gray-300">Cargando perfil...</span>
      <button onclick="toggleDarkMode()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg transition">🌙 / ☀️</button>
    </div>
  </nav>

  <!-- CONTENEDOR PRINCIPAL: Estructura exacta de 3 columnas idéntica al dashboard -->
  <main class="w-full mx-auto mt-6 pl-4 pr-0 grid grid-cols-1 lg:grid-cols-[220px_1fr_300px] gap-24">

    <!-- COLUMNA IZQUIERDA: MENÚ DE NAVEGACIÓN -->
    <aside class="hidden lg:block">
      <div class="sticky top-6">
        <div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800">
          <h2 class="font-bold text-gray-800 dark:text-white mb-4">
            ByKonet
          </h2>

          <nav class="space-y-2">
            <a href="dashboard.html" class="block p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-300">
              🏠 Inicio
            </a>
            <a href="#" class="block p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-300">
              👤 Mi perfil
            </a>
            <a href="#" class="block p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-300">
              🔔 Notificaciones
            </a>
            <a href="#" class="block p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-300">
              👥 Amigos
            </a>
          </nav>
        </div>
      </div>
    </aside>

    <!-- COLUMNA CENTRAL: Perfil del usuario y sus publicaciones -->
    <div class="space-y-6">
      
      <!-- Tarjeta de Cabecera del Perfil -->
      <div class="relative bg-white dark:bg-slate-900 rounded-xl shadow border border-gray-200 dark:border-slate-800 overflow-hidden">

  <!-- Foto de portada (flyer) -->
  <div id="coverWrapper" class="group relative w-full h-48 bg-slate-800 cursor-pointer">
    <img id="profileCover" src="" class="w-full h-full object-cover" alt="Portada">
    <div class="hidden absolute inset-0 bg-black/40 items-center justify-center transition opacity-0 group-hover:opacity-100" data-edit-overlay>
      <span class="text-white text-sm font-semibold">📷 Cambiar portada</span>
    </div>

    <button id="editProfileBtn" onclick="toggleEditMode()" style="display:none;"
      class="absolute top-3 right-3 bg-slate-900/70 hover:bg-slate-900 text-white text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700 transition">
      Editar perfil
    </button>
  </div>

  <!-- Avatar circular sobrepuesto abajo a la izquierda -->
  <div class="relative px-6 pb-6">
        <div id="avatarWrapper" class="group absolute -top-10 left-6 cursor-pointer">
      <img id="profileAvatar" src="" class="w-20 h-20 rounded-full object-cover border-4 border-white dark:border-slate-900 shadow-md" alt="Avatar">
            <div class="hidden absolute inset-0 rounded-full bg-black/40 items-center justify-center transition opacity-0 group-hover:opacity-100" data-edit-overlay>
        <span class="text-white text-xs">📷</span>
      </div>
    </div>

    <div class="pt-12 text-center sm:text-left sm:pl-24">
      <h2 id="profileName" class="text-xl font-bold text-gray-900 dark:text-white">Cargando...</h2>
    </div>
  </div>

  <!-- Inputs ocultos para seleccionar archivos (se activarán en el paso de edición) -->

  <!-- Inputs ocultos para seleccionar archivos (se activarán en el paso de edición) -->
  <input type="file" id="coverInput" accept="image/*" class="hidden">
  <input type="file" id="avatarInput" accept="image/*" class="hidden">

</div>

      <h3 class="text-lg font-bold text-gray-800 dark:text-gray-200 mb-2">Publicaciones de este usuario</h3>

      <!-- Contenedor del Muro del Usuario -->
      <div id="userFeed" class="space-y-4">
        <p class="text-center text-gray-500 dark:text-gray-400 bg-white dark:bg-slate-900 p-6 rounded-xl shadow border border-gray-200 dark:border-slate-800">Cargando publicaciones...</p>
      </div>

    </div>

    <!-- COLUMNA DERECHA: Barra de publicidad fija de 300x600 px -->
    <aside class="hidden lg:block">
      <div class="sticky top-6 bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800 flex flex-col items-center justify-center" style="width: 300px; height: 600px;">
        <span class="text-xs text-gray-400 uppercase tracking-widest mb-2 text-gray-400">Publicidad</span>
        <div id="ad-slot-sidebar" class="w-full h-full bg-gray-50 dark:bg-slate-950 border border-dashed border-gray-300 dark:border-slate-800 rounded-lg flex items-center justify-center text-center text-gray-400 text-sm">
          Espacio Publicitario<br>300 x 600 px
        </div>
      </div>
    </aside>

  </main>

  <script>
    const SUPABASE_URL = 'https://aiymadawznadvavzspxj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fL7vTXJ4NLhC2CJs9nPVAg_fvzWbfCY'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // MODO OSCURO POR DEFECTO
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }

    function formatCompactTime(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffInSeconds = Math.floor((now - date) / 1000);

      if (diffInSeconds < 60) return `${Math.max(1, diffInSeconds)}s`;
      
      const diffInMinutes = Math.floor(diffInSeconds / 60);
      if (diffInMinutes < 60) return `${diffInMinutes} min`;
      
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `${diffInHours}h`;

      const months = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sept.', 'oct.', 'nov.', 'dic.'];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();

      if (year === now.getFullYear()) return `${day} ${month}`;
      return `${day} ${month} ${year}`;
    }

       let currentUsername = null;
    let currentUserEmail = null;
    let isOwnProfile = false;

    async function initProfile() {
      const params = new URLSearchParams(window.location.search);
      const username = params.get('user');

      if (!username) {
        window.location.href = 'dashboard.html';
        return;
      }

      currentUsername = username;
      document.getElementById('profileTitle').textContent = `Perfil de @${username}`;
      document.getElementById('profileName').textContent = username;

      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        currentUserEmail = user.email;
        const loggedName = user.user_metadata?.full_name || '';
        isOwnProfile = loggedName === username;
      }

      document.getElementById('editProfileBtn').style.display = isOwnProfile ? 'block' : 'none';

      await loadProfileImages(username);
      loadUserPosts(username);
    }

    async function loadProfileImages(username) {
      const { data } = await supabaseClient
        .from('profiles')
        .select('avatar_url, cover_url')
        .eq('user_name', username)
        .maybeSingle();

      document.getElementById('profileAvatar').src =
        data?.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=random`;
      window.currentProfileAvatarUrl = data?.avatar_url || null; 

      const coverImg = document.getElementById('profileCover');
      if (data?.cover_url) {
        coverImg.src = data.cover_url;
        coverImg.style.display = 'block';
      } else {
        coverImg.style.display = 'none';
      }
    }

    function toggleEditMode() {
      document.querySelectorAll('[data-edit-overlay]').forEach(el => {
        el.classList.toggle('hidden');
        el.classList.toggle('flex');
      });
    }

    document.getElementById('coverWrapper').addEventListener('click', () => {
      const overlay = document.querySelector('#coverWrapper [data-edit-overlay]');
      if (isOwnProfile && !overlay.classList.contains('hidden')) {
        document.getElementById('coverInput').click();
      }
    });

    document.getElementById('avatarWrapper').addEventListener('click', () => {
      const overlay = document.querySelector('#avatarWrapper [data-edit-overlay]');
      if (isOwnProfile && !overlay.classList.contains('hidden')) {
        document.getElementById('avatarInput').click();
      }
    });

    document.getElementById('coverInput').addEventListener('change', e => handleImageUpload(e, 'cover'));
    document.getElementById('avatarInput').addEventListener('change', e => handleImageUpload(e, 'avatar'));

    async function handleImageUpload(event, tipo) {
      const file = event.target.files[0];
      if (!file) return;

      const ext = file.name.split('.').pop();
      const filePath = `${currentUserEmail}/${tipo}.${ext}`;

      const { error: uploadError } = await supabaseClient
        .storage
        .from('profile-images')
        .upload(filePath, file, { upsert: true });

      if (uploadError) {
        alert('Error al subir la imagen: ' + uploadError.message);
        return;
      }

      const { data: urlData } = supabaseClient
        .storage
        .from('profile-images')
        .getPublicUrl(filePath);

      const publicUrl = urlData.publicUrl + '?t=' + Date.now();
      const campoDb = tipo === 'avatar' ? 'avatar_url' : 'cover_url';

      const { error: dbError } = await supabaseClient
        .from('profiles')
        .upsert({
          user_email: currentUserEmail,
          user_name: currentUsername,
          [campoDb]: publicUrl
        }, { onConflict: 'user_email' });

      if (dbError) {
        alert('Error al guardar en la base de datos: ' + dbError.message);
        return;
      }

      if (tipo === 'avatar') {
        document.getElementById('profileAvatar').src = publicUrl;
      } else {
        const coverImg = document.getElementById('profileCover');
        coverImg.src = publicUrl;
        coverImg.style.display = 'block';
      }
    }

    async function loadUserPosts(username) {
      const { data: posts, error } = await supabaseClient
        .from('posts')
        .select('*')
        .eq('user_name', username)
        .order('created_at', { ascending: false });

      const feed = document.getElementById('userFeed');
      if (error || !posts.length) {
        feed.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 bg-white dark:bg-slate-900 p-6 rounded-xl shadow border border-gray-200 dark:border-slate-800">Este usuario aún no ha realizado publicaciones.</p>';
        return;
      }

      feed.innerHTML = posts.map(post => {
        const compactTime = formatCompactTime(post.created_at);
       const avatarUrl = window.currentProfileAvatarUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=random`;

        return `
          <div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800 space-y-3">
            <div class="flex items-center space-x-3">
              <img src="${avatarUrl}" class="w-10 h-10 rounded-full object-cover border border-gray-300 dark:border-slate-700">
              <div class="flex items-center space-x-2">
                <span class="font-bold text-gray-900 dark:text-white text-sm">${username}</span>
                <span class="text-gray-400 text-sm">·</span>
                <span class="text-sm text-gray-500 dark:text-gray-400">${compactTime}</span>
              </div>
            </div>

            ${post.content ? `<p class="text-gray-800 dark:text-gray-200 text-sm">${post.content}</p>` : ''}
            ${post.image_url ? `<img src="${post.image_url}" class="w-full rounded-lg max-h-96 object-cover">` : ''}
            
            <div class="flex items-center space-x-4 border-t border-gray-100 dark:border-slate-800 pt-2 text-sm text-gray-600 dark:text-gray-400">
              <span class="font-semibold">❤️ ${post.likes || 0} Likes</span>
            </div>
          </div>
        `;
      }).join('');
    }

    initProfile();
  </script>
</body>
</html>
