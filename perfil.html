  <script>
    const SUPABASE_URL = 'https://aiymadawznadvavzspxj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fL7vTXJ4NLhC2CJs9nPVAg_fvzWbfCY'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Evita que el botón "atrás" muestre una versión en caché (bfcache) de
    // esta página con datos desactualizados de sesión. Esta página también
    // se usa para ver perfiles públicos sin iniciar sesión, así que aquí
    // solo forzamos una recarga (no redirigimos), para refrescar el estado.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        window.location.reload();
      }
    });

    // MODO OSCURO POR DEFECTO
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }

    function formatCompactTime(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffInSeconds = Math.floor((now - date) / 1000);

      if (diffInSeconds < 60) return `${Math.max(1, diffInSeconds)}s`;
      
      const diffInMinutes = Math.floor(diffInSeconds / 60);
      if (diffInMinutes < 60) return `${diffInMinutes} min`;
      
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `${diffInHours}h`;

      const months = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sept.', 'oct.', 'nov.', 'dic.'];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();

      if (year === now.getFullYear()) return `${day} ${month}`;
      return `${day} ${month} ${year}`;
    }

       let currentUsername = null;
    let currentUserEmail = null;
    let loggedUserName = null;
    let isOwnProfile = false;

    async function initProfile() {
      const params = new URLSearchParams(window.location.search);
      const username = params.get('user');

      if (!username) {
        window.location.href = 'dashboard.html';
        return;
      }

      currentUsername = username;
      document.getElementById('profileName').textContent = username;

      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        currentUserEmail = user.email;
        loggedUserName = user.user_metadata?.full_name || user.email.split('@')[0];
        isOwnProfile = loggedUserName === username;
      }

      document.getElementById('editProfileBtn').style.display = isOwnProfile ? 'block' : 'none';

      initNotifications(currentUserEmail);
      await loadProfileImages(username);
      loadUserPosts(username);
    }

    async function loadProfileImages(username) {
      const { data } = await supabaseClient
        .from('profiles')
        .select('avatar_url, cover_url')
        .eq('user_name', username)
        .maybeSingle();

      document.getElementById('profileAvatar').src =
        data?.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=random`;
      window.currentProfileAvatarUrl = data?.avatar_url || null; 

      const coverImg = document.getElementById('profileCover');
      if (data?.cover_url) {
        coverImg.src = data.cover_url;
        coverImg.style.display = 'block';
      } else {
        coverImg.style.display = 'none';
      }
    }

    function toggleEditMode() {
      document.querySelectorAll('[data-edit-overlay]').forEach(el => {
        el.classList.toggle('hidden');
        el.classList.toggle('flex');
      });
    }

    function openImageViewer(src) {
      if (!src) return;
      document.getElementById('imageViewerImg').src = src;
      const viewer = document.getElementById('imageViewer');
      viewer.classList.remove('hidden');
      viewer.classList.add('flex');
    }

    function closeImageViewer() {
      const viewer = document.getElementById('imageViewer');
      viewer.classList.add('hidden');
      viewer.classList.remove('flex');
    }

    document.getElementById('coverWrapper').addEventListener('click', () => {
      const overlay = document.querySelector('#coverWrapper [data-edit-overlay]');
      if (isOwnProfile && !overlay.classList.contains('hidden')) {
        document.getElementById('coverInput').click();
      } else {
        const coverImg = document.getElementById('profileCover');
        if (coverImg.style.display !== 'none') openImageViewer(coverImg.src);
      }
    });

    document.getElementById('avatarWrapper').addEventListener('click', () => {
      const overlay = document.querySelector('#avatarWrapper [data-edit-overlay]');
      if (isOwnProfile && !overlay.classList.contains('hidden')) {
        document.getElementById('avatarInput').click();
      } else {
        openImageViewer(document.getElementById('profileAvatar').src);
      }
    });

    document.getElementById('coverInput').addEventListener('change', e => handleImageUpload(e, 'cover'));
    document.getElementById('avatarInput').addEventListener('change', e => handleImageUpload(e, 'avatar'));

    async function handleImageUpload(event, tipo) {
      const file = event.target.files[0];
      if (!file) return;

      const ext = file.name.split('.').pop();
      const filePath = `${currentUserEmail}/${tipo}.${ext}`;

      const { error: uploadError } = await supabaseClient
        .storage
        .from('profile-images')
        .upload(filePath, file, { upsert: true });

      if (uploadError) {
        alert('Error al subir la imagen: ' + uploadError.message);
        return;
      }

      const { data: urlData } = supabaseClient
        .storage
        .from('profile-images')
        .getPublicUrl(filePath);

      const publicUrl = urlData.publicUrl + '?t=' + Date.now();
      const campoDb = tipo === 'avatar' ? 'avatar_url' : 'cover_url';

      const { error: dbError } = await supabaseClient
        .from('profiles')
        .upsert({
          user_email: currentUserEmail,
          user_name: currentUsername,
          [campoDb]: publicUrl
        }, { onConflict: 'user_email' });

      if (dbError) {
        alert('Error al guardar en la base de datos: ' + dbError.message);
        return;
      }

      if (tipo === 'avatar') {
        document.getElementById('profileAvatar').src = publicUrl;
      } else {
        const coverImg = document.getElementById('profileCover');
        coverImg.src = publicUrl;
        coverImg.style.display = 'block';
      }
    }

    async function loadUserPosts(username) {
      const { data: posts, error } = await supabaseClient
        .from('posts')
        .select('*')
        .eq('user_name', username)
        .order('created_at', { ascending: false });

      const feed = document.getElementById('userFeed');
      if (error || !posts.length) {
        feed.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 bg-white dark:bg-slate-900 p-6 rounded-xl shadow border border-gray-200 dark:border-slate-800">Este usuario aún no ha realizado publicaciones.</p>';
        return;
      }

      // Publicaciones que el usuario que ve el perfil ya reposteó (sin cita), para pintar el botón en verde
      let myPlainReposts = new Set();
      if (currentUserEmail) {
        const ids = posts.map(p => p.id);
        const { data: myReposts } = await supabaseClient
          .from('posts')
          .select('repost_of')
          .eq('user_email', currentUserEmail)
          .is('quote_text', null)
          .in('repost_of', ids);
        myPlainReposts = new Set((myReposts || []).map(r => r.repost_of));
      }

      feed.innerHTML = posts.map(post => {
        const compactTime = formatCompactTime(post.created_at);
       const avatarUrl = window.currentProfileAvatarUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=random`;
        const isReposted = myPlainReposts.has(post.id);

        return `
          <div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow border border-gray-200 dark:border-slate-800 space-y-3">
            <div class="flex items-center space-x-3">
              <img src="${avatarUrl}" class="w-10 h-10 rounded-full object-cover border border-gray-300 dark:border-slate-700">
              <div class="flex items-center space-x-2">
                <span class="font-bold text-gray-900 dark:text-white text-sm">${username}</span>
                <span class="text-gray-400 text-sm">·</span>
                <span class="text-sm text-gray-500 dark:text-gray-400">${compactTime}</span>
              </div>
            </div>

            ${post.content ? `<p class="text-gray-800 dark:text-gray-200 text-sm cursor-pointer" onclick="openPostViewer(${post.id})">${post.content}</p>` : ''}
            ${post.image_url ? `<img src="${post.image_url}" class="w-full rounded-lg max-h-96 object-cover cursor-pointer" onclick="openPostViewer(${post.id})">` : ''}
            
            <div class="flex items-center space-x-5 border-t border-gray-100 dark:border-slate-800 pt-2 text-sm text-gray-600 dark:text-gray-400">

              <button
                onclick="likePost(${post.id}, ${post.likes || 0})"
                title="Me gusta"
                class="flex items-center gap-1.5 hover:text-red-500 font-semibold transition">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"></path></svg>
                <span id="likes-count-${post.id}">${post.likes || 0}</span>
              </button>

              <button
                onclick="commentPost(${post.id})"
                title="Comentar"
                class="hover:text-blue-600 font-semibold transition">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"></path></svg>
              </button>

              <div class="relative">

                <button
                  onclick="toggleRepostMenu(${post.id})"
                  data-repost-toggle
                  title="Repostear"
                  class="hover:text-green-600 font-semibold transition ${isReposted ? 'text-green-600' : ''}">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
                </button>

                <div
                  id="repost-menu-${post.id}"
                  class="hidden absolute left-0 bottom-full mb-2 w-52 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl shadow-lg overflow-hidden z-40">

                  ${isReposted ? `
                    <button
                      onclick="undoRepost(${post.id})"
                      class="w-full flex items-center gap-2 text-left px-4 py-3 hover:bg-gray-100 dark:hover:bg-slate-800 transition">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 flex-shrink-0"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
                      Deshacer
                    </button>

                    <button
                      onclick="quotePost(${post.id})"
                      class="w-full flex items-center gap-2 text-left px-4 py-3 hover:bg-gray-100 dark:hover:bg-slate-800 transition">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 flex-shrink-0"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
                      Citar
                    </button>
                  ` : `
                    <button
                      onclick="repostPost(${post.id})"
                      class="w-full flex items-center gap-2 text-left px-4 py-3 hover:bg-gray-100 dark:hover:bg-slate-800 transition">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 flex-shrink-0"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
                      Repostear
                    </button>

                    <button
                      onclick="quotePost(${post.id})"
                      class="w-full flex items-center gap-2 text-left px-4 py-3 hover:bg-gray-100 dark:hover:bg-slate-800 transition">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 flex-shrink-0"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
                      Citar
                    </button>
                  `}

                </div>

              </div>

              <button
                onclick="sharePost('${(post.content || '').replace(/'/g, "\\'")}')"
                title="Compartir"
                class="hover:text-blue-600 font-semibold transition">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 flex-shrink-0"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
              </button>

            </div>
          </div>
        `;
      }).join('');
    }

    // ===== BOTONES DE PUBLICACIÓN: like, comentar, repostear, compartir =====
    function commentPost(postId) {
      openPostViewer(postId);
    }

    async function likePost(id, currentLikes) {
      if (!currentUserEmail) { window.location.href = 'index.html'; return; }
      const newLikes = currentLikes + 1;
      const counterElement = document.getElementById(`likes-count-${id}`);
      if (counterElement) counterElement.textContent = newLikes;
      await supabaseClient.from('posts').update({ likes: newLikes }).eq('id', id);

      // Registramos quién dio el like (para poder notificar al dueño de la publicación)
      await supabaseClient.from('post_likes').insert({ post_id: id, user_email: currentUserEmail, user_name: loggedUserName });
    }

    function toggleRepostMenu(postId) {
      const menu = document.getElementById(`repost-menu-${postId}`);
      if (!menu) return;

      document.querySelectorAll('[id^="repost-menu-"]').forEach(m => {
        if (m !== menu) m.classList.add('hidden');
      });

      menu.classList.toggle('hidden');
    }

    // Cierra el menú de repost si el usuario hace clic en cualquier otro lugar
    document.addEventListener('click', (e) => {
      const isToggleButton = e.target.closest('[data-repost-toggle]');
      const isInsideMenu = e.target.closest('[id^="repost-menu-"]');
      if (!isToggleButton && !isInsideMenu) {
        document.querySelectorAll('[id^="repost-menu-"]').forEach(menu => menu.classList.add('hidden'));
      }
    });

    async function repostPost(postId) {
      if (!currentUserEmail) { window.location.href = 'index.html'; return; }

      const { error } = await supabaseClient
        .from('posts')
        .insert([
          {
            user_email: currentUserEmail,
            user_name: loggedUserName,
            content: null,
            image_url: null,
            likes: 0,
            repost_of: postId,
            quote_text: null
          }
        ]);

      if (error) { console.error(error); return; }

      toggleRepostMenu(postId);
      loadUserPosts(currentUsername);
    }

    async function undoRepost(postId) {
      if (!currentUserEmail) return;

      const { error } = await supabaseClient
        .from('posts')
        .delete()
        .eq('repost_of', postId)
        .eq('user_email', currentUserEmail)
        .is('quote_text', null);

      if (error) { console.error(error); return; }

      toggleRepostMenu(postId);
      loadUserPosts(currentUsername);
    }

    async function quotePost(postId) {
      if (!currentUserEmail) { window.location.href = 'index.html'; return; }

      const quoteText = prompt('Escribe tu cita para este repost:');
      if (quoteText === null) return;

      const { error } = await supabaseClient
        .from('posts')
        .insert([
          {
            user_email: currentUserEmail,
            user_name: loggedUserName,
            content: null,
            image_url: null,
            likes: 0,
            repost_of: postId,
            quote_text: quoteText.trim() || null
          }
        ]);

      if (error) { console.error(error); return; }

      toggleRepostMenu(postId);
      loadUserPosts(currentUsername);
    }

    function sharePost(text) {
      if (navigator.share) {
        navigator.share({ title: 'ByKonet', text: text, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Enlace copiado al portapapeles.');
      }
    }

    // ===== VISOR DE POST + COMENTARIOS =====
    let currentViewerPostId = null;

    async function openPostViewer(postId) {
      currentViewerPostId = postId;

      const { data: post, error } = await supabaseClient
        .from('posts')
        .select('*')
        .eq('id', postId)
        .single();

      if (error || !post) return;

      const { data: profileRow } = await supabaseClient
        .from('profiles')
        .select('avatar_url')
        .eq('user_name', post.user_name)
        .maybeSingle();

      const avatarUrl = profileRow?.avatar_url || post.avatar_url ||
        `https://ui-avatars.com/api/?name=${encodeURIComponent(post.user_name || 'Usuario')}&background=random`;

      document.getElementById('postViewerAvatar').src = avatarUrl;
      document.getElementById('postViewerAuthor').textContent = post.user_name || 'Usuario';
      document.getElementById('postViewerTime').textContent = formatCompactTime(post.created_at);
      document.getElementById('postViewerContent').textContent = post.content || '';

      const imageWrap = document.getElementById('postViewerImageWrap');
      if (post.image_url) {
        document.getElementById('postViewerImage').src = post.image_url;
        imageWrap.classList.remove('hidden');
      } else {
        imageWrap.classList.add('hidden');
      }

      const input = document.getElementById('postViewerCommentInput');
      input.value = '';
      updateCharCount();

      await loadComments(postId);

      const viewer = document.getElementById('postViewer');
      viewer.classList.remove('hidden');
      viewer.classList.add('flex');
    }

    function closePostViewer() {
      const viewer = document.getElementById('postViewer');
      viewer.classList.add('hidden');
      viewer.classList.remove('flex');
      currentViewerPostId = null;
    }

    function closePostViewerBackdrop(e) {
      if (e.target.id === 'postViewer') closePostViewer();
    }

    async function loadComments(postId) {
      const container = document.getElementById('postViewerComments');
      container.innerHTML = '<p class="text-sm text-gray-400 text-center">Cargando comentarios...</p>';

      const { data: comments, error } = await supabaseClient
        .from('comments')
        .select('*')
        .eq('post_id', postId)
        .order('created_at', { ascending: true });

      if (error || !comments || !comments.length) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center">Aún no hay comentarios. ¡Sé el primero!</p>';
        return;
      }

      container.innerHTML = comments.map(c => `
        <div class="flex items-start gap-2">
          <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(c.user_name)}&background=random" class="w-8 h-8 rounded-full object-cover flex-shrink-0">
          <div class="bg-gray-100 dark:bg-slate-800 rounded-xl px-3 py-2 flex-1">
            <div class="text-xs font-bold text-gray-900 dark:text-white">${c.user_name}</div>
            <div class="text-sm text-gray-700 dark:text-gray-200 break-words">${c.content}</div>
          </div>
        </div>
      `).join('');

      container.scrollTop = container.scrollHeight;
    }

    function updateCharCount() {
      const input = document.getElementById('postViewerCommentInput');
      const counter = document.getElementById('postViewerCharCount');
      const remaining = 280 - input.value.length;
      counter.textContent = remaining;
      counter.classList.toggle('text-red-500', remaining < 0);
      document.getElementById('postViewerSubmitBtn').disabled = remaining < 0 || input.value.trim().length === 0;
    }

    async function submitComment() {
      const input = document.getElementById('postViewerCommentInput');
      const content = input.value.trim();
      if (!content || content.length > 280 || !currentViewerPostId) return;

      if (!currentUserEmail) {
        alert('Debes iniciar sesión para comentar.');
        return;
      }

      const { error } = await supabaseClient.from('comments').insert({
        post_id: currentViewerPostId,
        user_email: currentUserEmail,
        user_name: loggedUserName,
        content: content
      });

      if (error) {
        alert('Error al comentar: ' + error.message);
        return;
      }

      input.value = '';
      updateCharCount();
      await loadComments(currentViewerPostId);
    }

    initProfile();
  </script>
  <!-- Visor de imagen (avatar/portada) -->
  <div id="imageViewer" class="hidden fixed inset-0 bg-black/90 z-[100] items-center justify-center p-4" onclick="closeImageViewer()">
    <img id="imageViewerImg" src="" class="max-w-full max-h-full rounded-lg object-contain" alt="Vista ampliada">
    <button onclick="closeImageViewer()" class="absolute top-4 right-4 text-white text-3xl leading-none hover:opacity-70">&times;</button>
  </div>

  <!-- Visor de post + comentarios -->
  <div id="postViewer" class="hidden fixed inset-0 bg-black/80 z-[100] items-center justify-center p-4" onclick="closePostViewerBackdrop(event)">
    <div class="bg-white dark:bg-slate-900 rounded-xl overflow-hidden max-w-4xl w-full max-h-[90vh] flex flex-col md:flex-row">

      <div id="postViewerImageWrap" class="hidden md:w-1/2 bg-black flex items-center justify-center">
        <img id="postViewerImage" src="" class="max-h-[90vh] w-full object-contain" alt="Imagen del post">
      </div>

      <div class="md:w-1/2 w-full flex flex-col max-h-[90vh]">
        <div class="p-4 border-b border-gray-200 dark:border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img id="postViewerAvatar" src="" class="w-10 h-10 rounded-full object-cover">
            <div>
              <div id="postViewerAuthor" class="font-bold text-gray-900 dark:text-white text-sm"></div>
              <div id="postViewerTime" class="text-xs text-gray-500 dark:text-gray-400"></div>
            </div>
          </div>
          <button onclick="closePostViewer()" class="text-2xl text-gray-500 hover:text-gray-800 dark:hover:text-white leading-none">&times;</button>
        </div>

        <div class="p-4 border-b border-gray-100 dark:border-slate-800">
          <p id="postViewerContent" class="text-gray-800 dark:text-gray-200 text-sm break-words"></p>
        </div>

        <div id="postViewerComments" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

        <div class="p-3 border-t border-gray-200 dark:border-slate-800">
          <textarea id="postViewerCommentInput" maxlength="280" rows="2" placeholder="Escribe un comentario..." oninput="updateCharCount()" class="w-full p-2 text-sm border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
          <div class="flex items-center justify-between mt-2">
            <span id="postViewerCharCount" class="text-xs text-gray-400">280</span>
            <button id="postViewerSubmitBtn" onclick="submitComment()" disabled class="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-bold py-1.5 px-4 rounded-full transition">Comentar</button>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
