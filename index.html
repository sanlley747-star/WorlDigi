<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByGether — Get together</title>
  <link rel="stylesheet" href="styles.css">
<style>.password-toggle-icon{width:16px;height:16px;display:block}</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">
     <img src="assets/logo-circle.png" alt="ByGether logo">
    </a>
    <div class="nav-actions">
      <button class="btn btn-ghost" id="loginBtn">Sign in</button>
      <button class="btn btn-primary" id="signupBtn">Create account</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-glow glow-one"></div>
      <div class="hero-glow glow-two"></div>

      <div class="hero-content">
        <div class="logo-wrap">
         <img src="assets/logo.png" alt="ByGether" class="hero-logo">
        </div>

        <h1>Get together</h1>
        <p class="hero-text">
          Meet people, discover places, share ideas and explore a digital world
          built around people and communities.
        </p>

        <div class="hero-actions">
          <button class="btn btn-primary btn-large" id="heroSignup">Create your account</button>
          <button class="btn btn-outline btn-large" id="heroLogin">Sign in</button>
        </div>

  <div class="features">
    <div>
    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
    <strong>Discover</strong>
    <small>People & places</small>
  </div>

  <div>
    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
    </svg>
    <strong>Interact</strong>
    <small>Communities & ideas</small>
  </div>

  <div>
    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
      <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
      <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
    </svg>
    <strong>Explore</strong>
    <small>Your digital universe</small>
  </div>
</div>
      </div>
    </section>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <button class="close" id="closeModal" aria-label="Close">×</button>
      <h2 id="modalTitle">Create your account</h2>
      <p id="modalSubtitle">Join ByGether and begin exploring.</p>
      <form id="demoForm">
        <input id="nameField" type="text" placeholder="Your name">
        <input id="emailField" type="email" placeholder="Email address" required>
  <div class="relative">
    <input type="password" id="passwordField" placeholder="Tu contraseña" class="w-full p-3 border border-gray-300 rounded-lg pr-20 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-600 bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded font-semibold transition">
      <svg class="password-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
  </div>
        <a href="#" id="forgotPasswordLink" class="forgot-password-link" style="display:none;">¿Olvidaste tu contraseña?</a>
        <button class="btn btn-primary btn-large" type="submit" id="formSubmit">Create account</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
