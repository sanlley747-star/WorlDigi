<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TuNetFy</title>
  <script>
    // La raíz siempre delega la decisión de sesión al dashboard.
    // Conserva query y hash para que Supabase procese OAuth/confirmación.
    window.location.replace('dashboard.html' + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <p>Entrando a TuNetFy… <a id="continue" href="dashboard.html">Continuar</a></p>
  <script>
    document.getElementById('continue').href =
      'dashboard.html' + window.location.search + window.location.hash;
  </script>
</body>
</html>
