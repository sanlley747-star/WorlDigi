    <div class="w-full max-w-xl space-y-6">

    <!-- Apariencia -->
    <div class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow border border-gray-200 dark:border-slate-800">
      <h2 class="text-lg font-bold mb-1 text-gray-900 dark:text-white">Apariencia</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Elige cómo se ve la plataforma.</p>
      <div class="flex gap-3">
        <button id="btnLight" onclick="setTheme('light')" class="flex-1 py-2.5 rounded-lg border border-gray-300 dark:border-slate-700 font-semibold transition">☀️ Claro</button>
        <button id="btnDark" onclick="setTheme('dark')" class="flex-1 py-2.5 rounded-lg border border-gray-300 dark:border-slate-700 font-semibold transition">🌙 Oscuro</button>
      </div>
    </div>

    <!-- Accesibilidad -->
    <div class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow border border-gray-200 dark:border-slate-800">
      <h2 class="text-lg font-bold mb-1 text-gray-900 dark:text-white">Accesibilidad</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Ajusta el tamaño de letra de toda la plataforma.</p>
      <div class="flex items-center gap-3">
        <button onclick="changeFontScale(-10)" class="w-11 h-11 rounded-lg border border-gray-300 dark:border-slate-700 font-bold text-lg hover:bg-gray-100 dark:hover:bg-slate-800 transition">A-</button>
        <span id="fontScaleLabel" class="flex-1 text-center font-semibold text-gray-700 dark:text-gray-300">100%</span>
        <button onclick="changeFontScale(10)" class="w-11 h-11 rounded-lg border border-gray-300 dark:border-slate-700 font-bold text-lg hover:bg-gray-100 dark:hover:bg-slate-800 transition">A+</button>
      </div>
      <button onclick="resetFontScale()" class="mt-3 text-sm text-blue-600 dark:text-blue-400 hover:underline">Restablecer tamaño</button>
    </div>

    <!-- Cuenta -->
    <div class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow border border-gray-200 dark:border-slate-800">
      <h2 class="text-lg font-bold mb-1 text-gray-900 dark:text-white">Cuenta</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-4" id="accountEmail">Cargando cuenta...</p>
      <button onclick="logout()" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition">Cerrar Sesión</button>
    </div>

    <!-- Cambiar contraseña -->
    <div class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow border border-gray-200 dark:border-slate-800" id="passwordCard" style="display:none;">
      <h2 class="text-lg font-bold mb-1 text-gray-900 dark:text-white">Contraseña</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Cambia la contraseña de tu cuenta.</p>
      <form id="passwordForm" class="space-y-3">
        <input type="password" id="newPasswordInput" placeholder="Nueva contraseña" minlength="8" required
          class="w-full p-3 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="password" id="confirmPasswordInput" placeholder="Confirmar nueva contraseña" minlength="8" required
          class="w-full p-3 border border-gray-300 dark:border-slate-700 dark:bg-slate-800 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit" id="passwordSubmit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition">Actualizar contraseña</button>
      </form>
      <p class="text-sm mt-3" id="passwordStatus"></p>
    </div>

  <script>
    const SUPABASE_URL = 'https://aiymadawznadvavzspxj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fL7vTXJ4NLhC2CJs9nPVAg_fvzWbfCY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Evita que el botón "atrás" muestre una versión en caché (bfcache) de
    // esta página con datos desactualizados de sesión. Esta página muestra
    // ajustes generales aunque no haya sesión, así que aquí solo forzamos
    // una recarga (no redirigimos), para refrescar el estado mostrado.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        window.location.reload();
      }
    });

    // MODO OSCURO POR DEFECTO
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }

    function setTheme(mode) {
      const html = document.documentElement;
      if (mode === 'light') {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      updateThemeButtons();
    }

    function updateThemeButtons() {
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('btnDark').classList.toggle('ring-2', isDark);
      document.getElementById('btnDark').classList.toggle('ring-blue-500', isDark);
      document.getElementById('btnLight').classList.toggle('ring-2', !isDark);
      document.getElementById('btnLight').classList.toggle('ring-blue-500', !isDark);
    }

    // ACCESIBILIDAD: tamaño de letra (aplica a toda la plataforma via localStorage)
    function getFontScale() {
      return parseInt(localStorage.getItem('fontScale') || '100', 10);
    }

    function applyFontScale(value) {
      document.documentElement.style.fontSize = value + '%';
      document.getElementById('fontScaleLabel').textContent = value + '%';
    }

    function changeFontScale(delta) {
      let value = getFontScale() + delta;
      if (value < 80) value = 80;
      if (value > 150) value = 150;
      localStorage.setItem('fontScale', value);
      applyFontScale(value);
    }

    function resetFontScale() {
      localStorage.setItem('fontScale', 100);
      applyFontScale(100);
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.replace('index.html');
    }

    function showPasswordStatus(message, isError) {
      const el = document.getElementById('passwordStatus');
      el.textContent = message;
      el.className = 'text-sm mt-3 ' + (isError ? 'text-red-500' : 'text-green-600 dark:text-green-400');
    }

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPasswordInput').value;
      const confirmPassword = document.getElementById('confirmPasswordInput').value;
      const submitBtn = document.getElementById('passwordSubmit');

      if (newPassword !== confirmPassword) {
        showPasswordStatus('Las dos contraseñas no coinciden.', true);
        return;
      }
      if (newPassword.length < 8) {
        showPasswordStatus('La contraseña debe tener al menos 8 caracteres.', true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Actualizando...';

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      if (error) {
        showPasswordStatus('No se pudo actualizar: ' + error.message, true);
      } else {
        showPasswordStatus('Contraseña actualizada correctamente.', false);
        document.getElementById('passwordForm').reset();
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Actualizar contraseña';
    });

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        document.getElementById('accountEmail').textContent = 'Sesión iniciada como ' + user.email;
        const profileName = user.user_metadata?.full_name || user.email.split('@')[0];
        document.getElementById('myProfileLink').href = 'perfil.html?user=' + encodeURIComponent(profileName);
        document.getElementById('passwordCard').style.display = 'block';
      } else {
        document.getElementById('accountEmail').textContent = 'No has iniciado sesión.';
        document.getElementById('passwordCard').style.display = 'none';
      }
      updateThemeButtons();
      applyFontScale(getFontScale());
    }

    init();
  </script>
