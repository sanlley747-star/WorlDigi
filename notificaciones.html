    function hideForAuth() {
      document.documentElement.classList.add('auth-pending');
    }
    function revealApp() {
      document.documentElement.classList.remove('auth-pending');
    }

    window.addEventListener('pagehide', hideForAuth);

    window.addEventListener('pageshow', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.replace('index.html');
        return;
      }
      revealApp();
    });

    let currentUser = null;

    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {

    function formatCompactTime(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffInSeconds = Math.floor((now - date) / 1000);

      if (diffInSeconds < 60) return `${Math.max(1, diffInSeconds)}s`;
      const diffInMinutes = Math.floor(diffInSeconds / 60);
      if (diffInMinutes < 60) return `${diffInMinutes} min`;
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `${diffInHours}h`;

      const months = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sept.', 'oct.', 'nov.', 'dic.'];
      const day = date.getDate();
      const month = months[date.getMonth()];
      const year = date.getFullYear();

      if (year === now.getFullYear()) return `${day} ${month}`;
      return `${day} ${month} ${year}`;
    }

    function linkifyContent(text) { if (!text) return ''; const urlRegex = /(https?:\/\/[^\s]+)/g; return text.replace(urlRegex, (url) => { let domain; try { domain = new URL(url).hostname.replace('www.', ''); } catch (e) { domain = url; } return `<a href="${url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="inline-flex items-center gap-1 text-green-600 dark:text-green-400 font-semibold hover:underline align-middle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 inline-block"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>${domain}</a>`; }); }

    function notifTypeIconHtml(type) {

    },
    quote: {
      label: 'Cita',

    }
  };
  const config = icons[type];
  if (!config) return '';
  return '<span data-notif-type-icon="' + type + '" class="w-6 h-6 flex-shrink-0" role="img" title="' + config.label + '" aria-label="' + config.label + '">' + config.svg + '</span>';
}

function connNotifState(st) {
      const iFollow = !!(st && st.iFollow);
      const followsMe = !!(st && st.followsMe);
      if (iFollow && followsMe) return 'mutual';
      if (iFollow || followsMe) return 'single';
      return 'none';
    }

    function connNotifIconHtml(state) {
      const normalizedState = ['mutual', 'single', 'none'].includes(state) ? state : 'none';
      const labels = {
        mutual: 'Se conectaron mutuamente',
        single: 'Solo una persona se ha conectado',
        none: 'Sin conexión'
      };
      const label = labels[normalizedState];
      return '<span data-conn-icon data-state="' + normalizedState + '" class="w-6 h-7 flex-shrink-0" title="' + label + '" role="img" aria-label="' + label + '">' +
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%" aria-hidden="true" focusable="false">' +
          '<g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">' +
            '<line x1="161.10" y1="49.80" x2="61.10" y2="124.80" />' +
            '<line x1="168.90" y1="60.20" x2="68.90" y2="135.20" />' +
            '<line x1="66.94" y1="123.82" x2="176.94" y2="158.82" />' +
            '<line x1="63.06" y1="136.18" x2="173.06" y2="171.18" />' +
            '<line x1="171.10" y1="159.80" x2="71.10" y2="234.80" />' +
            '<line x1="178.90" y1="170.20" x2="78.90" y2="245.20" />' +
          '</g><g fill="currentColor">' +
            '<circle cx="165" cy="55" r="22" /><circle cx="65" cy="130" r="22" /><circle cx="175" cy="165" r="22" /><circle cx="75" cy="240" r="22" />' +
          '</g></svg></span>';
    }
    function notifTypeText(actorName) {
      return {
        comment: `<strong data-user-card="${connEscape(actorName)}">${connEscape(actorName)}</strong> comentó tu publicación`,
        like: `<strong data-user-card="${connEscape(actorName)}">${connEscape(actorName)}</strong> le dio me gusta a tu publicación`,

        connection: `<strong data-user-card="${connEscape(actorName)}">${connEscape(actorName)}</strong> estableció conexión`

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.replace('index.html');
        return;
      }
      currentUser = user;

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
      document.getElementById('myProfileLink').href = `perfil.html?user=${encodeURIComponent(authorName)}`;
      document.getElementById('mobileMyProfileLink').href = `perfil.html?user=${encodeURIComponent(authorName)}`;

      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const mobileFunctionMenu = document.getElementById('mobileFunctionMenu');
      mobileMenuToggle?.addEventListener('click', () => {
        const isHidden = mobileFunctionMenu.classList.toggle('hidden');
        mobileMenuToggle.setAttribute('aria-expanded', String(!isHidden));
      });
      mobileFunctionMenu?.addEventListener('click', (event) => {
        if (event.target.closest('a')) {
          mobileFunctionMenu.classList.add('hidden');
          mobileMenuToggle?.setAttribute('aria-expanded', 'false');
        }

      initNotifications(currentUser.email);
      await loadNotifWall();

    const notifCommentContext = new Map();

    async function loadNotifWall() {
      const wall = document.getElementById('notifWall');

      // Este mural es privado: las políticas de la base de datos ya garantizan
      // que solo el dueño de la cuenta (recipient_email = su propio correo) puede
      // ver sus notificaciones, sin importar quién intente entrar a esta página.
      const { data: notifs, error } = await supabaseClient
        .from('notifications')
        .select('*')
        .eq('recipient_email', currentUser.email)
        .order('created_at', { ascending: false })
        .limit(50);

      if (error || !notifs || !notifs.length) {
        wall.innerHTML = '<p class="p-6 text-sm text-gray-400 dark:text-gray-500 text-center">Aún no tienes notificaciones.</p>';
        return;
      }

      // Datos comunes de las notificaciones.
      const actorEmails = [...new Set(notifs.map(n => n.actor_email).filter(Boolean))];
      const connActorEmails = notifs.filter(n => n.type === 'connection').map(n => n.actor_email).filter(Boolean);
      const commentNotifs = notifs.filter(n => n.type === 'comment' && n.comment_id);
      const commentIds = [...new Set(commentNotifs.map(n => n.comment_id))];
      const postIds = [...new Set(notifs.map(n => n.post_id).filter(Boolean))];

      // Una sola consulta por conjunto: comentarios, padres, dueños de posts y perfiles.
      const { data: comments } = commentIds.length
        ? await supabaseClient.from('comments').select('id,post_id,user_email,user_name,content,created_at,reply_to').in('id', commentIds)
        : { data: [] };

      const parentIds = [...new Set((comments || []).map(c => c.reply_to).filter(Boolean))];
      const [parentRes, postRes, profileRes, connStates] = await Promise.all([
        parentIds.length
          ? supabaseClient.from('comments').select('id,user_email,user_name').in('id', parentIds)
          : Promise.resolve({ data: [] }),
        postIds.length
          ? supabaseClient.from('posts').select('id,user_name,user_email').in('id', postIds)
          : Promise.resolve({ data: [] }),
        actorEmails.length
          ? supabaseClient.from('profiles').select('user_email,avatar_url').in('user_email', actorEmails)
          : Promise.resolve({ data: [] }),
        connActorEmails.length
          ? connFetchStates(currentUser.email, [...new Set(connActorEmails)])
          : Promise.resolve({})
      ]);

      window.__bygetherNotifConnStates = connStates;

      const commentById = {};
      (comments || []).forEach(c => { commentById[c.id] = c; });

      const parentById = {};
      (parentRes.data || []).forEach(c => { parentById[c.id] = c; });

      const postById = {};
      (postRes.data || []).forEach(p => { postById[p.id] = p; });

      const avatarByEmail = {};
      (profileRes.data || []).forEach(p => { avatarByEmail[p.user_email] = p.avatar_url; });

      // Datos de los botones de cada comentario, cargados en lote.
      const [likeCounts, replyCounts, repostCounts, myCommentLikes, myCommentReposts] = commentIds.length
        ? await Promise.all([
            ccFetchCommentLikeCounts(commentIds),
            ccFetchCommentReplyCounts(commentIds),
            ccFetchCommentRepostCounts(commentIds),
            ccFetchMyCommentLikes(commentIds, currentUser.email),
            ccFetchMyCommentReposts(commentIds, currentUser.email)
          ])
        : [{}, {}, {}, new Set(), new Set()];

      notifCommentContext.clear();
      (comments || []).forEach(c => {
        notifCommentContext.set(c.id, {
          postId: c.post_id,
          replyTo: c.reply_to || null
        });
      });

      wall.innerHTML = notifs.map(n => {
        const actorName = n.actor_name || (n.actor_email ? n.actor_email.split('@')[0] : 'Usuario');
        const safeActorName = connEscape(actorName);
        const avatarUrl = avatarByEmail[n.actor_email] || connAvatarFallback(actorName);
        const safeAvatarUrl = connEscape(avatarUrl);
        const unreadClass = n.is_read ? '' : 'bg-blue-50 dark:bg-slate-800/70';

        if (n.type === 'connection') {
          const st = connStates[n.actor_email] || { iFollow: false, followsMe: true };
          const connIconHtml = connNotifIconHtml(connNotifState(st))
            .replace('<span data-conn-icon ', '<span data-notif-conn-icon data-conn-icon data-email="' + connEscape(n.actor_email) + '" ');
          return `
            <div class="w-full p-4 flex items-center gap-3 transition ${unreadClass} min-w-0">
              ${connIconHtml}
              <a href="${connProfileUrl(actorName)}" class="flex items-start gap-3 flex-1 min-w-0 notif-comment-link">
                <img src="${safeAvatarUrl}" class="w-11 h-11 rounded-full object-cover flex-shrink-0 border border-gray-200 dark:border-slate-700" alt="${safeActorName}">
                <div class="flex-1 min-w-0">
                  <p class="text-sm text-gray-800 dark:text-gray-100"><strong data-user-card="${safeActorName}">${safeActorName}</strong> estableció conexión</p>
                  <p class="text-xs text-gray-400 mt-1">${formatCompactTime(n.created_at)}</p>
                </div>
              </a>
              <div class="flex-shrink-0" data-conn-slot data-email="${connEscape(n.actor_email)}" data-name="${safeActorName}"></div>
            </div>
          `;
        }

        const texts = notifTypeText(actorName);
        const message = texts[n.type] || `<strong data-user-card="${safeActorName}">${safeActorName}</strong> interactuó con tu publicación`;

        if (n.type === 'comment' && n.comment_id) {
          const c = commentById[n.comment_id];

          // Si el comentario fue eliminado, se conserva la fila antigua como respaldo.
          if (c) {
            const post = postById[c.post_id] || postById[n.post_id] || {};
            const parent = c.reply_to ? parentById[c.reply_to] : null;
            const recipientName = parent?.user_name || post.user_name || (n.recipient_email || currentUser.email).split('@')[0];
            const safeRecipientName = connEscape(recipientName);
            const recipientHref = `perfil.html?user=${encodeURIComponent(recipientName)}`;
            const actions = ccCommentActionsHtml(c, {
              likes: likeCounts[c.id] || 0,
              replies: replyCounts[c.id] || 0,
              reposts: repostCounts[c.id] || 0,
              isLiked: myCommentLikes.has(c.id),
              isReposted: myCommentReposts.has(c.id),
              userEmail: currentUser.email,
              userName: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
              postId: c.post_id
            });

            return `
              <div class="w-full text-left p-4 flex items-start gap-3 hover:bg-gray-50 dark:hover:bg-slate-800 transition ${unreadClass}" onclick="handleNotifClick(${c.post_id}, ${n.id})">
                <a href="${connProfileUrl(actorName)}" class="flex-shrink-0 notif-comment-link">
                  <img src="${safeAvatarUrl}" class="w-11 h-11 rounded-full object-cover border border-gray-200 dark:border-slate-700 hover:opacity-80 transition" alt="${safeActorName}">
                </a>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2">
                    <a href="${connProfileUrl(actorName)}" data-user-card="${safeActorName}" class="font-bold text-sm text-gray-900 dark:text-white hover:underline notif-comment-link">${safeActorName}</a>
                    <span class="text-gray-400 text-sm">·</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400">${formatCompactTime(c.created_at)}</span>
                  </div>
                  <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">Comentó a <a href="${recipientHref}" data-user-card="${safeRecipientName}" class="text-green-500 hover:underline notif-comment-link">${safeRecipientName}</a></p>
                  <p class="text-sm text-gray-800 dark:text-gray-200 break-words whitespace-pre-line mt-1">${linkifyContent(connEscape(c.content || ''))}</p>
                  <div class="publicacion-comment-actions">${actions}</div>
                </div>
              </div>
            `;
          }
        }

        return `
          <button onclick="handleNotifClick(${n.post_id}, ${n.id})" class="w-full text-left p-4 flex items-start gap-3 hover:bg-gray-50 dark:hover:bg-slate-800 transition ${unreadClass}">
            ${notifTypeIconHtml(n.type)}
            <img src="${safeAvatarUrl}" class="w-11 h-11 rounded-full object-cover flex-shrink-0 border border-gray-200 dark:border-slate-700" alt="${safeActorName}">
            <div class="flex-1 min-w-0">
              <p class="text-sm text-gray-800 dark:text-gray-100">${message}</p>
              <p class="text-xs text-gray-400 mt-1">${formatCompactTime(n.created_at)}</p>
            </div>
          </button>
        `;
      }).join('');

      wall.querySelectorAll('.notif-comment-link, .publicacion-comment-actions').forEach(el => {
        el.addEventListener('click', event => event.stopPropagation());
      });

      wall.querySelectorAll('[data-conn-slot]').forEach(slot => {
        const email = slot.dataset.email;
        const st = connStates[email] || { iFollow: false, followsMe: false };
        slot.appendChild(connCreateButton({
          myEmail: currentUser.email,
          myName: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
          otherEmail: email,
          otherName: slot.dataset.name,
          iFollow: st.iFollow,
          followsMe: st.followsMe,
          variant: 'notif',
          compact: true
        }));
      });

      // Al entrar a su mural, el usuario ya las está viendo: se marcan como leídas.
      await supabaseClient
        .from('notifications')
        .update({ is_read: true })
        .eq('recipient_email', currentUser.email)
        .eq('is_read', false);
      refreshNotifCount();
    }

    if (!window.__bygetherNotifConnListener) {
      window.__bygetherNotifConnListener = true;
      window.addEventListener('conn:changed', (event) => {
        const { email, iFollow } = event.detail || {};
        if (!email) return;

        const states = window.__bygetherNotifConnStates || {};
        const current = states[email] || { iFollow: false, followsMe: true };
        states[email] = { ...current, iFollow: !!iFollow };

        document.querySelectorAll('[data-notif-conn-icon][data-email="' + connEscape(email) + '"]').forEach(icon => {
          const state = connNotifState(states[email]);
          const labels = {
            mutual: 'Se conectaron mutuamente',
            single: 'Solo una persona se ha conectado',
            none: 'Sin conexión'
          };
          icon.dataset.state = state;
          icon.title = labels[state];
          icon.setAttribute('aria-label', labels[state]);
        });
      });
    }
    window.onReplyToComment = async function (commentId) {
      const ctx = notifCommentContext.get(commentId);
      if (!ctx) return;

      const replyText = prompt('Escribe una respuesta:');
      if (replyText === null) return;

      const content = replyText.trim();
      if (!content || content.length > 280) return;

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
      const { error } = await supabaseClient.from('comments').insert({
        post_id: ctx.postId,
        user_email: currentUser.email,
        user_name: authorName,
        content,
        reply_to: commentId
      });

      if (error) {
        alert('Error al responder: ' + error.message);
        return;
      }

      await loadNotifWall();
    };

    window.onRepostComment = async function (commentId, quoteText) {
      const ctx = notifCommentContext.get(commentId);
      if (!ctx) return;

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
      const { error } = await supabaseClient.from('posts').insert({
        user_email: currentUser.email,
        user_name: authorName,
        content: null,
        image_url: null,
        likes: 0,
        repost_of_comment_id: commentId,
        quote_text: quoteText || null
      });

      if (error) {
        alert('Error al repostear: ' + error.message);
        return;
      }

      await loadNotifWall();
    };

    window.onUndoCommentRepost = async function (commentId) {
      const { error } = await supabaseClient
        .from('posts')
        .delete()
        .eq('repost_of_comment_id', commentId)
        .eq('user_email', currentUser.email)
        .is('quote_text', null);

      if (error) {
        alert('Error al deshacer el repost: ' + error.message);
        return;
      }

      await loadNotifWall();
    };

    function handleNotifClick(postId, notifId) {
      if (postId) openPostViewer(postId);
    }

    // ===== VISOR DE POST + COMENTARIOS (igual al del muro principal) =====
    let currentViewerPostId = null;

    async function openPostViewer(postId) {
      currentViewerPostId = postId;

      const { data: post, error } = await supabaseClient
        .from('posts')
        .select('*')
        .eq('id', postId)
        .single();

      if (error || !post) return;

      const { data: profileRow } = await supabaseClient
        .from('profiles')
        .select('avatar_url')
        .eq('user_name', post.user_name)
        .maybeSingle();

      const avatarUrl = profileRow?.avatar_url || post.avatar_url ||
        `https://ui-avatars.com/api/?name=${encodeURIComponent(post.user_name || 'Usuario')}&background=random`;

      document.getElementById('postViewerAvatar').src = avatarUrl;
      document.getElementById('postViewerAuthor').textContent = post.user_name || 'Usuario';
      document.getElementById('postViewerAuthor').setAttribute('data-user-card', post.user_name || '');
      document.getElementById('postViewerTime').textContent = formatCompactTime(post.created_at);
      document.getElementById('postViewerContent').innerHTML = post.content ? linkifyContent(post.content) : '';

      const imageWrap = document.getElementById('postViewerImageWrap');
      if (post.image_url) {
        document.getElementById('postViewerImage').src = post.image_url;
        imageWrap.classList.remove('hidden');
      } else {
        imageWrap.classList.add('hidden');
      }

      const input = document.getElementById('postViewerCommentInput');
      input.value = '';
      updateCharCount();

      await loadComments(postId);

      const viewer = document.getElementById('postViewer');
      viewer.classList.remove('hidden');
      viewer.classList.add('flex');
    }

    function closePostViewer() {
      const viewer = document.getElementById('postViewer');
      viewer.classList.add('hidden');
      viewer.classList.remove('flex');
      currentViewerPostId = null;
    }

    function closePostViewerBackdrop(e) {
      if (e.target.id === 'postViewer') closePostViewer();
    }

    async function loadComments(postId) {
      const container = document.getElementById('postViewerComments');
      container.innerHTML = '<p class="text-sm text-gray-400 text-center">Cargando comentarios...</p>';

      const { data: comments, error } = await supabaseClient
        .from('comments')
        .select('*')
        .eq('post_id', postId)
        .order('created_at', { ascending: true });

      if (error || !comments || !comments.length) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center">Aún no hay comentarios. ¡Sé el primero!</p>';
        return;
      }

      // Fotos de perfil de quienes comentaron (por su correo); quien no tiene foto conserva su avatar de iniciales
      const commenterEmails = [...new Set(comments.map(c => c.user_email).filter(Boolean))];
      const commentAvatarByEmail = {};
      if (commenterEmails.length) {
        const { data: commenterProfiles } = await supabaseClient
          .from('profiles')
          .select('user_email, avatar_url')
          .in('user_email', commenterEmails);
        (commenterProfiles || []).forEach(p => { if (p.avatar_url) commentAvatarByEmail[p.user_email] = p.avatar_url; });
      }

      container.innerHTML = comments.map(c => `
        <div class="flex items-start gap-2">
          <img src="${connEscape(commentAvatarByEmail[c.user_email] || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(c.user_name) + '&background=random'))}" class="w-8 h-8 rounded-full object-cover flex-shrink-0">
          <div class="bg-gray-100 dark:bg-slate-800 rounded-xl px-3 py-2 flex-1">
            <div class="text-xs font-bold text-gray-900 dark:text-white" data-user-card="${connEscape(c.user_name)}">${connEscape(c.user_name)}</div>
            <div class="text-sm text-gray-700 dark:text-gray-200 break-words">${c.content}</div>
          </div>
        </div>
      `).join('');

      container.scrollTop = container.scrollHeight;
    }

    function updateCharCount() {
      const input = document.getElementById('postViewerCommentInput');
      const counter = document.getElementById('postViewerCharCount');
      const remaining = 280 - input.value.length;
      counter.textContent = remaining;
      counter.classList.toggle('text-red-500', remaining < 0);
      document.getElementById('postViewerSubmitBtn').disabled = remaining < 0 || input.value.trim().length === 0;
    }

    async function submitComment() {
      const input = document.getElementById('postViewerCommentInput');
      const content = input.value.trim();
      if (!content || content.length > 280 || !currentViewerPostId) return;

      const authorName = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];

      const { error } = await supabaseClient.from('comments').insert({
        post_id: currentViewerPostId,
        user_email: currentUser.email,
        user_name: authorName,
        content: content
      });

      if (error) {
        alert('Error al comentar: ' + error.message);
        return;
      }

      input.value = '';
      updateCharCount();
      await loadComments(currentViewerPostId);
    }

    init();
  </script>

  <!-- Visor de post + comentarios -->
  <div id="postViewer" class="hidden fixed inset-0 bg-black/80 z-[100] items-center justify-center p-4" onclick="closePostViewerBackdrop(event)">
    <div class="bg-white dark:bg-slate-900 rounded-xl overflow-hidden max-w-4xl w-full max-h-[90vh] flex flex-col md:flex-row">

      <div id="postViewerImageWrap" class="hidden md:w-1/2 bg-black flex items-center justify-center">
        <img id="postViewerImage" src="" class="max-h-[90vh] w-full object-contain" alt="Imagen del post">
      </div>

      <div class="md:w-1/2 w-full flex flex-col max-h-[90vh]">
        <div class="p-4 border-b border-gray-200 dark:border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img id="postViewerAvatar" src="" class="w-10 h-10 rounded-full object-cover">
            <div>
              <div id="postViewerAuthor" class="font-bold text-gray-900 dark:text-white text-sm"></div>
              <div id="postViewerTime" class="text-xs text-gray-500 dark:text-gray-400"></div>
            </div>
          </div>
          <button onclick="closePostViewer()" class="text-2xl text-gray-500 hover:text-gray-800 dark:hover:text-white leading-none">&times;</button>
        </div>

        <div class="p-4 border-b border-gray-100 dark:border-slate-800">
          <p id="postViewerContent" class="text-gray-800 dark:text-gray-200 text-sm break-words"></p>
        </div>

        <div id="postViewerComments" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

        <div class="p-3 border-t border-gray-200 dark:border-slate-800">
          <textarea id="postViewerCommentInput" maxlength="280" rows="2" placeholder="Escribe un comentario..." oninput="updateCharCount()" class="w-full p-2 text-sm border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-gray-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
          <div class="flex items-center justify-between mt-2">
            <span id="postViewerCharCount" class="text-xs text-gray-400">280</span>
            <button id="postViewerSubmitBtn" onclick="submitComment()" disabled class="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-bold py-1.5 px-4 rounded-full transition">Comentar</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="mobile-nav.js"></script>
</body>
</html>
