<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuNetFy — Nueva contraseña</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .reset-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .reset-card{width:min(420px,100%);background:white;border-radius:24px;padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.15)}
    .reset-card h2{margin:0 0 8px}
    .reset-card p{color:var(--muted);line-height:1.5;margin:0 0 20px}
    .reset-card input{width:100%;box-sizing:border-box;padding:12px 14px;margin-bottom:14px;border:1px solid #d7e0ea;border-radius:10px;font-size:15px}
    .password-field{position:relative}
    .password-field input{padding-right:50px}
    .password-toggle{position:absolute;right:5px;top:calc(50% - 7px);transform:translateY(-50%);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#64748b;cursor:pointer;padding:0}
    .password-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .password-toggle .eye-off{display:none}
    .password-toggle[aria-pressed="true"] .eye-on{display:none}
    .password-toggle[aria-pressed="true"] .eye-off{display:block}
    .reset-status{font-size:14px;margin-top:12px;line-height:1.5}
    .reset-status.error{color:#c0392b}
    .reset-status.ok{color:#1a7f37}
  </style>
</head>
<body>
  <div class="reset-wrap">
    <div class="reset-card">
      <h2 id="resetTitle">Crea tu nueva contraseña</h2>
      <p id="resetSubtitle">Escribe una contraseña nueva para tu cuenta de TuNetFy.</p>

      <form id="resetForm">
        <div class="password-field">
          <input type="password" id="newPassword" placeholder="Nueva contraseña" minlength="8" required>
          <button type="button" class="password-toggle" data-password-toggle="newPassword" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 5.1-1.3"/></svg>
          </button>
        </div>
        <div class="password-field">
          <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" minlength="8" required>
          <button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 5.1-1.3"/></svg>
          </button>
        </div>
        <button class="btn btn-primary btn-large" type="submit" id="resetSubmit" style="width:100%">Guardar contraseña</button>
      </form>
      <p class="reset-status" id="resetStatus"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://aiymadawznadvavzspxj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fL7vTXJ4NLhC2CJs9nPVAg_fvzWbfCY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('resetForm');
    const statusEl = document.getElementById('resetStatus');
    const submitBtn = document.getElementById('resetSubmit');

    let recoverySessionReady = false;

    form.querySelectorAll('[data-password-toggle]').forEach(button => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.passwordToggle);
        const showing = input.type === 'password';
        input.type = showing ? 'text' : 'password';
        button.setAttribute('aria-label', showing ? 'Ocultar contraseña' : 'Mostrar contraseña');
        button.setAttribute('aria-pressed', String(showing));
        input.focus();
        const end = input.value.length;
        input.setSelectionRange(end, end);
      });
    });

    function showStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.className = 'reset-status ' + (isError ? 'error' : 'ok');
    }

    // supabase-js detecta automáticamente el token de recuperación en la URL
    // (#access_token=...&type=recovery) y dispara este evento cuando la
    // sesión temporal de recuperación queda lista para usarse.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        recoverySessionReady = true;
      }
    });

    // Si el usuario llega aquí sin un enlace de recuperación válido (por
    // ejemplo, entrando directo a la URL), se lo avisamos en vez de dejar
    // que el formulario falle en silencio.
    setTimeout(async () => {
      if (recoverySessionReady) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        showStatus('Este enlace no es válido o ya expiró. Solicita uno nuevo desde "¿Olvidaste tu contraseña?" en la pantalla de inicio de sesión.', true);
        form.querySelectorAll('input, button').forEach(el => el.disabled = true);
      }
    }, 1500);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        showStatus('Las dos contraseñas no coinciden.', true);
        return;
      }
      if (newPassword.length < 8) {
        showStatus('La contraseña debe tener al menos 8 caracteres.', true);
        return;
      }
      if (!recoverySessionReady) {
        showStatus('El enlace no es válido o ya venció. Solicita uno nuevo desde Iniciar sesión.', true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando...';

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      if (error) {
        showStatus('No se pudo actualizar la contraseña: ' + error.message, true);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Guardar contraseña';
      } else {
        showStatus('Contraseña actualizada. Redirigiendo a inicio de sesión...', false);
        await supabaseClient.auth.signOut();
        setTimeout(() => { window.location.href = 'index.html'; }, 1800);
      }
    });
  </script>
</body>
</html>
